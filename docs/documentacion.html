<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentación Técnica y Arquitectura - Forensic Data Recovery Suite</title>
    <style>
        
:root {
    --bg-body: #0d1117;
    --bg-surface: #161b22;
    --bg-sidebar: #13171e;
    --bg-card: #21262d;
    --border-color: #30363d;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --accent-green: #3fb950;
    --accent-gold: #d29922;
    --accent-orange: #db6d28;
    --accent-red: #f85149;
    --code-bg: #11151c;
    --search-highlight: rgba(234, 179, 8, 0.4);
    --header-h: 68px;
    --sidebar-w: 290px;
    --toc-w: 270px;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

[data-theme="light"] {
    --bg-body: #f6f8fa;
    --bg-surface: #ffffff;
    --bg-sidebar: #f0f2f5;
    --bg-card: #f6f8fa;
    --border-color: #d0d7de;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8c959f;
    --accent: #0969da;
    --accent-hover: #218bff;
    --accent-green: #1a7f37;
    --accent-gold: #9a6700;
    --accent-orange: #bc4c00;
    --accent-red: #cf222e;
    --code-bg: #f6f8fa;
    --search-highlight: rgba(255, 215, 0, 0.6);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-family);
    background-color: var(--bg-body);
    color: var(--text-primary);
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

header {
    height: var(--header-h);
    background-color: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text-primary);
}

.brand-icon {
    font-size: 28px;
    line-height: 1;
}

.brand-title {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

.badge-ver {
    background: rgba(88, 166, 255, 0.15);
    color: var(--accent);
    border: 1px solid rgba(88, 166, 255, 0.4);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 12px;
    text-transform: uppercase;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-box {
    position: relative;
    display: flex;
    align-items: center;
}

.search-input {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 7px 12px 7px 32px;
    color: var(--text-primary);
    font-size: 13px;
    width: 230px;
    transition: all 0.2s ease;
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    width: 300px;
}

.search-icon {
    position: absolute;
    left: 10px;
    font-size: 13px;
    color: var(--text-muted);
    pointer-events: none;
}

.btn-header {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}

.btn-header:hover {
    background-color: var(--border-color);
}

.app-container {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
}

.content-area {
    flex: 1;
    overflow-y: auto;
    padding: 36px 48px;
    scroll-behavior: smooth;
}

.markdown-body {
    max-width: 940px;
    margin: 0 auto;
}

.toc-panel {
    width: var(--toc-w);
    background-color: var(--bg-surface);
    border-right: 1px solid var(--border-color);
    padding: 20px 16px;
    overflow-y: auto;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toc-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
}

.toc-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.toc-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 12px;
    line-height: 1.4;
    padding: 5px 8px;
    border-radius: 4px;
    display: block;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.toc-link:hover {
    color: var(--text-primary);
    background-color: var(--bg-card);
}

.toc-link.depth-3 {
    padding-left: 18px;
    font-size: 11.5px;
}

/* Tipografía y bloques Markdown */
.markdown-body h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
}

.markdown-body h2 {
    font-size: 20px;
    font-weight: 700;
    margin-top: 32px;
    margin-bottom: 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(48, 54, 61, 0.5);
    color: var(--text-primary);
}

.markdown-body h3 {
    font-size: 16px;
    font-weight: 600;
    margin-top: 24px;
    margin-bottom: 10px;
    color: var(--accent);
}

.markdown-body p {
    margin-bottom: 16px;
    color: var(--text-primary);
    line-height: 1.7;
}

.markdown-body ul, .markdown-body ol {
    margin-bottom: 18px;
    padding-left: 24px;
}

.markdown-body li {
    margin-bottom: 6px;
    line-height: 1.6;
}

.markdown-body code {
    font-family: var(--font-mono);
    background-color: var(--code-bg);
    border: 1px solid var(--border-color);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12.5px;
    color: #ff7b72;
}

.markdown-body pre {
    background-color: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    margin-bottom: 20px;
    position: relative;
}

.markdown-body pre code {
    background-color: transparent;
    border: none;
    padding: 0;
    font-size: 12.5px;
    color: var(--text-primary);
}

.copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
}

pre:hover .copy-btn { opacity: 1; }

.markdown-body table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 24px;
    font-size: 13px;
}

.markdown-body th, .markdown-body td {
    border: 1px solid var(--border-color);
    padding: 10px 14px;
    text-align: left;
}

.markdown-body th {
    background-color: var(--bg-card);
    font-weight: 600;
}

.markdown-body tr:nth-child(even) {
    background-color: rgba(255, 255, 255, 0.02);
}

.alert-box {
    padding: 14px 16px;
    margin-bottom: 18px;
    border-radius: 6px;
    border-left: 4px solid;
    background-color: var(--bg-card);
}

.alert-box.caution { border-left-color: var(--accent-red); background-color: rgba(248, 81, 73, 0.08); }
.alert-box.warning { border-left-color: var(--accent-orange); background-color: rgba(219, 109, 40, 0.08); }
.alert-box.tip { border-left-color: var(--accent-green); background-color: rgba(63, 185, 80, 0.08); }
.alert-box.note { border-left-color: var(--accent); background-color: rgba(88, 166, 255, 0.08); }

.alert-title {
    font-weight: 700;
    font-size: 12.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
}

.alert-box.caution .alert-title { color: var(--accent-red); }
.alert-box.warning .alert-title { color: var(--accent-orange); }
.alert-box.tip .alert-title { color: var(--accent-green); }
.alert-box.note .alert-title { color: var(--accent); }

mark.search-match {
    background-color: var(--search-highlight);
    color: inherit;
    padding: 1px 3px;
    border-radius: 2px;
    font-weight: bold;
}

@media print {
    header, .toc-panel, .sidebar-tabs, .copy-btn { display: none !important; }
    body, .content-area {
        overflow: visible !important;
        height: auto !important;
        background: white !important;
        color: black !important;
    }
}

@media (max-width: 1024px) {
    .toc-panel { display: none; }
    .content-area { padding: 24px 20px; }
}


        .sidebar-tabs {
            width: var(--sidebar-w);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 14px 10px;
            gap: 4px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 10px 12px 4px 12px;
            letter-spacing: 0.5px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s ease;
        }

        .tab-btn:hover {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background-color: rgba(88, 166, 255, 0.12);
            color: var(--accent);
            border-color: rgba(88, 166, 255, 0.35);
        }

        .tab-btn-title {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .tab-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .tab-btn.active .tab-badge {
            background-color: rgba(88, 166, 255, 0.25);
            color: var(--accent);
            border-color: rgba(88, 166, 255, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-icon">🔬</span>
            <div>
                <div class="brand-title">
                    Forensic Data Recovery Suite
                    <span class="badge-ver">v2.5.0</span>
                </div>
                <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Portal Técnico, Arquitectura & Código</div>
            </div>
        </div>

        <div class="header-actions">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="globalSearch" class="search-input" placeholder="Buscar en la documentación...">
            </div>

            <button class="btn-header" id="themeToggle" title="Cambiar tema">
                <span id="themeIcon">☀️</span> Tema
            </button>

            <button class="btn-header" id="printBtn" title="Imprimir o guardar como PDF">
                🖨️ Imprimir
            </button>
        </div>
    </header>

    <div class="app-container">
        <!-- 1. Barra Lateral de Módulos Técnicos -->
        <nav class="sidebar-tabs" id="sidebarNav">
            <div class="sidebar-section-title">Módulos Técnicos & Código</div>
        </nav>

        <!-- 2. Área Central de Contenido -->
        <main class="content-area" id="contentArea">
            <div class="markdown-body" id="docContent"></div>
        </main>

        <!-- 3. Panel Lateral Derecho: Tabla de Contenidos -->
        <aside class="toc-panel" id="tocPanel">
            <div class="toc-title">Índice del Módulo</div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>
    </div>
