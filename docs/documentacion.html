uter.py       # Ruteo contextual y mapeo dinámico de carpetas\n│   ├── software_filter.py      # Filtro inteligente de exclusión de software y juegos\n│   └── exporter.py             # Exportador seguro, árbol original y hashes SHA-256\n├── ui/                         # Interfaz gráfica moderna con PyQt5\n│   ├── main_window.py          # Ventana principal, orquestación y seguridad al exportar\n│   ├── info_bar.py             # HUD de Telemetría en vivo (tiempo, velocidad, contadores)\n│   ├── scan_panel.py           # Panel lateral de escaneo, alcance y protocolos\n│   ├── popups.py               # Diálogos emergentes para formatos (82 tipos), carpetas y protocolos\n│   ├── results_table.py        # Tabla interactiva con badges de calidad y selección aislada\n│   ├── preview_widget.py       # Visor multi-pestaña (Gráfico, Media, Texto, Hex, Metadatos)\n│   ├── session_dialog.py       # Diálogo modal para explorar y administrar sesiones\n│   ├── directory_selector.py   # Selector manual y automático interactivo de carpetas\n│   ├── worker.py               # Hilos asíncronos (QThread) de escaneo y exportación\n│   └── theme.py                # Estilos visuales QSS oscuros profesionales\n├── data/                       # Almacenamiento local SQLite (recovery_vault.db)\n├── sessions/                   # Directorio de sesiones persistentes (.json)\n├── dist/                       # Ejecutable standalone portátil compilado\n│   └── RecuperadorDeDatos.exe  # Ejecutable 100% portable y autónomo para Windows (256 MB)\n└── tests/\n    └── test_core.py            # Batería de 9 pruebas unitarias forenses completas (100% passing)\n```\n\n---\n\n## 📦 Ejecutable Autónomo Portable y Base de Datos Local\n\n### 1. 🚀 Ejecutable Portable 100% Autónomo (`dist/RecuperadorDeDatos.exe`)\n- No requiere instalar Python ni librerías adicionales.\n- Se puede copiar a cualquier memoria USB, disco duro externo o PC con Windows y ejecutar directamente sin proceso de instalación.\n- Para recompilar la herramienta en cualquier momento, basta con hacer doble clic en **`build.bat`** o ejecutar:\n  ```powershell\n  python build_exe.py\n  ```\n\n### 2. 💾 Base de Datos Local SQLite con Autoconstrucción (`core/local_db.py`)\n- **Operación 100% Local y Offline**: No requiere servidores de bases de datos externos.\n- **Autoconstrucción de Esquema**: Al iniciarse por primera vez, crea automáticamente el archivo `data/recovery_vault.db` con tablas e índices optimizados (`sessions`, `recovered_items`, `software_catalog`, `export_audit`, `app_config`).\n- **Caché Instantánea de Software**: Almacena en base de datos las rutas de juegos y programas instalados, reduciendo el tiempo de inicialización a $< 0.02$ segundos.\n\n### 3. 🛡️ Verificador Preventivo de Requisitos del Sistema (`core/env_checker.py`)\n- Verifica al inicio los componentes esenciales:\n  - ✅ **Microsoft Visual C++ 2015-2022 Redistributable (x64)**\n  - ✅ **Microsoft .NET Framework 4.5 o superior**\n  - ✅ **Arquitectura Windows 10/11 de 64 bits (AMD64)**\n  - ✅ **Bibliotecas de interfaz gráfica y multimedia PyQt5**\n- **Diálogo Nativo Win32 a Prueba de Fallos**: Si faltase algún complemento, despliega una ventana emergente de Windows detallando el diagnóstico con enlaces oficiales directos de descarga de Microsoft.\n\n---\n\n## 🚀 Cómo Iniciar la Aplicación\n\n1. **Ejecutable Directo (Recomendado sin instalación)**:\n   - Doble clic en `dist\\RecuperadorDeDatos.exe`.\n2. **Modo Estándar con Python (Doble clic en `run.bat`)**:\n   - Acceso inmediato con selector manual y ruteo automático por tipo de archivo.\n3. **Modo Administrador (Doble clic en `run_as_admin.bat`)**:\n   - Desbloquea acceso completo a Copias de Sombra (VSS) y sectores físicos.\n4. **Desde la Consola**:\n   ```powershell\n   python main.py\n   ```\n\n"}}

    <script>
        const DOC_MAP = JSON.parse(document.getElementById('doc-data').textContent);
        let currentDocId = "tecnico";
        let originalHtmlCache = {};

        if (typeof marked !== 'undefined') {
            marked.setOptions({
                gfm: true,
                breaks: false,
                highlight: function(code, lang) {
                    if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return typeof hljs !== 'undefined' ? hljs.highlightAuto(code).value : code;
                }
            });
        }

        function parseAlerts(html) {
            return html
                .replace(/<blockquote>\s*<p>\s*\[!NOTE\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, 
                    '<div class="alert-box note"><div class="alert-title">ℹ️ NOTA INFORMATIVA</div><p>$1</p></div>')
                .replace(/<blockquote>\s*<p>\s*\[!TIP\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, 
                    '<div class="alert-box tip"><div class="alert-title">💡 CONSEJO ÚTIL</div><p>$1</p></div>')
                .replace(/<blockquote>\s*<p>\s*\[!IMPORTANT\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, 
                    '<div class="alert-box warning"><div class="alert-title">⚠️ IMPORTANTE</div><p>$1</p></div>')
                .replace(/<blockquote>\s*<p>\s*\[!WARNING\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, 
                    '<div class="alert-box warning"><div class="alert-title">⚠️ ADVERTENCIA</div><p>$1</p></div>')
                .replace(/<blockquote>\s*<p>\s*\[!CAUTION\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, 
                    '<div class="alert-box caution"><div class="alert-title">🛑 ATENCIÓN CRÍTICA</div><p>$1</p></div>');
        }

        function initSidebarTabs() {
            const nav = document.getElementById('sidebarNav');
            const keys = Object.keys(DOC_MAP);

            keys.forEach(docId => {
                const d = DOC_MAP[docId];
                const btn = document.createElement('button');
                btn.className = `tab-btn ${docId === currentDocId ? 'active' : ''}`;
                btn.id = `tab-btn-${docId}`;
                btn.onclick = () => switchTab(docId);

                btn.innerHTML = `
                    <div class="tab-btn-title">
                        <span>${d.icon}</span>
                        <span>${d.title}</span>
                    </div>
                    <span class="tab-badge">${d.badge}</span>
                `;
                nav.appendChild(btn);

        }

        function switchTab(docId) {
            if (!DOC_MAP[docId]) return;
            currentDocId = docId;

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-btn-${docId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const contentEl = document.getElementById('docContent');

            if (!originalHtmlCache[docId]) {
                let rawHtml = marked.parse(DOC_MAP[docId].markdown);
                rawHtml = parseAlerts(rawHtml);
                originalHtmlCache[docId] = rawHtml;

            contentEl.innerHTML = originalHtmlCache[docId];

            contentEl.querySelectorAll('pre').forEach(pre => {
                const btn = document.createElement('button');

                btn.innerText = 'Copiar';
                btn.onclick = () => {
                    const code = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
                    navigator.clipboard.writeText(code);
                    btn.innerText = '¡Copiado!';
                    setTimeout(() => btn.innerText = 'Copiar', 1500);
                };
                pre.appendChild(btn);
            });

            buildTableOfContents();
            document.getElementById('contentArea').scrollTop = 0;

            const searchVal = document.getElementById('globalSearch').value.trim();
            if (searchVal) performSearch(searchVal);
        }

        function buildTableOfContents() {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';
            const contentEl = document.getElementById('docContent');
            const headings = contentEl.querySelectorAll('h1, h2, h3');

            headings.forEach((h, index) => {
                const id = `heading-${index}`;
                h.id = id;

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = `toc-link depth-${h.tagName.toLowerCase().charAt(1)}`;
                a.href = `#${id}`;
                a.innerText = h.innerText.replace(/^[#\s]+/, '');
                a.onclick = (e) => {
                    e.preventDefault();
                    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    history.pushState(null, null, `#${id}`);
                };
                li.appendChild(a);
                tocList.appendChild(li);
            });
        }

        function performSearch(query) {
            const contentEl = document.getElementById('docContent');
            if (!query) {
                contentEl.innerHTML = originalHtmlCache[currentDocId] || contentEl.innerHTML;
                return;
            }

            const raw = originalHtmlCache[currentDocId] || contentEl.innerHTML;
            const escaped = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            const temp = document.createElement('div');
            temp.innerHTML = raw;

            function highlightTextNodes(node) {
                if (node.nodeType === 3) {
                    const val = node.nodeValue;
                    if (val && regex.test(val)) {
                        const span = document.createElement('span');
                        span.innerHTML = val.replace(regex, '<mark class="search-match">$1</mark>');
                        node.parentNode.replaceChild(span, node);
                    }
                } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
                    Array.from(node.childNodes).forEach(highlightTextNodes);
                }
            }

            highlightTextNodes(temp);
            contentEl.innerHTML = temp.innerHTML;
        }

        document.getElementById('globalSearch').addEventListener('input', (e) => {
            performSearch(e.target.value.trim());
        });

        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        themeBtn.onclick = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            themeIcon.innerText = next === 'dark' ? '☀️' : '🌙';
        };

        document.getElementById('printBtn').onclick = () => window.print();

        window.addEventListener('DOMContentLoaded', () => {
            initSidebarTabs();
            switchTab('tecnico');
        });
    </script>
</body>
</html>
