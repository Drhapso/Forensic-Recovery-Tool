    <script id="doc-data" type="application/json">
        {"tecnico": {"id": "tecnico", "title": "Manual Técnico & Forense", "icon": "🔬", "badge": "Avanzado", "markdown": "# 🔬 Manual de Uso Técnico y Forense\n\nEste manual está dirigido a **administradores de sistemas, especialistas en soporte técnico avanzado y peritos informáticos forenses**. Detalla los fundamentos físicos y lógicos de los protocolos de recuperación, los algoritmos matemáticos de validación estructural y las directrices periciales para la preservación de evidencias.\n\n---\n\n## 1. Fundamentos de los 6 Protocolos Forenses\n\n```mermaid\ngraph TD\n    DISK[Unidad de Almacenamiento Físico o Volumen Lógico] --> MFT[1. MFT Scanner NTFS]\n    DISK --> VSS[2. Volume Shadow Copies VSS]\n    DISK --> RB[3. Analizador $Recycle.Bin]\n    DISK --> TC[4. Extractor Windows Thumbcache]\n    DISK --> TM[5. Escáner de Borradores Office / %TEMP%]\n    DISK --> FC[6. File Carving Estructural por Firmas]\n```\n\n### 1.1 Analizador de Master File Table (`core/mft_scanner.py`)\n* **Mecanismo:** En sistemas de archivos NTFS, la estructura de cada fichero o directorio está definida en un registro de **1024 bytes** dentro del metarchivo `$MFT`.\n* **Detección de registros eliminados:** El offset `0x16` del registro contiene una bandera de 2 bytes (flags):\n  * `0x0001`: Archivo en uso.\n  * `0x0000`: Archivo marcado como **eliminado** (sus clusters en disco quedan marcados como libres para ser reasignados).\n* **Extracción de Atributos:**\n  * `$STANDARD_INFORMATION (0x10)`: Extrae marcas de tiempo temporales originales de 64 bits (MACB: Modificado, Accesado, Creado, MFT modificado).\n  * `$FILE_NAME (0x30)`: Extrae el nombre de archivo original en codificación UTF-16LE y el puntero al directorio padre.\n  * `$DATA (0x80)`: Si el tamaño del fichero es menor a ~700 bytes, los datos son **residentes** dentro del propio registro MFT, permitiendo una recuperación 100% garantizada e íntegra aun cuando los clusters de datos del volumen hayan sido sobreescritos.\n\n### 1.2 File Carving Estructural Avanzado (`core/file_carver.py`)\nA diferencia de los talladores primitivos basados exclusivamente en buscar firmas iniciales (Magic Bytes) y asumir tamaños fijos, este motor implementa **validación matemática de estructuras de contenedor**:\n\n* **JPEG (Anti-Truncamiento de Miniatura EXIF):**\n  * *Patología forense común:* Las fotos tomadas por cámaras y smartphones contienen una miniatura incrustada en el bloque `APP1` delimitada por marcadores `\\xFF\\xD8 ... \\xFF\\xD9`. Los talladores genéricos se detienen en el primer marcador `\\xFF\\xD9`, recuperando una miniatura degradada de 12 KB y perdiendo la fotografía real de alta resolución.\n  * *Algoritmo implementado:* Nuestro parser recorre la secuencia formal de marcadores de longitud variable (`SOI`, `APP0-15`, `DQT`, `DHT`, `SOF0`, `SOF2`). Ignora cualquier `\\xFF\\xD9` antes del bloque `SOS` (*Start of Scan*). Dentro del flujo comprimido de entropía maneja el escape de bytes (*byte stuffing* `\\xFF\\x00`) y los marcadores de reinicio (`RST0` a `RST7`), asegurando que la imagen se cierre únicamente en el auténtico `EOI` (*End of Image*) final.\n* **PNG (Validación de Chunks y Suma CRC32):**\n  * Navega la secuencia obligatoria de chunks de 4 partes: Longitud (4B) + Tipo (4B) + Datos (NB) + CRC32 (4B).\n  * Calcula el algoritmo matemático de redundancia cíclica CRC32 sobre Tipo + Datos y lo contrasta con el valor almacenado en cada bloque.\n  * Finaliza en el chunk `IEND` (`\\x49\\x45\\x4E\\x44\\xAE\\x42\\x60\\x82`), garantizando archivos completos sin artefactos visuales ni franjas grises.\n* **MP4 / MOV (Jerarquía de Cajas ATOM):**\n  * Analiza la jerarquía de cajas ISO/IEC 14496-12: `ftyp`, `moov`, `mvhd`, `tkhd`, `mdat`, `free`.\n  * Extrae dimensiones de video (resolución hasta 4K/8K), escala de tiempo y duración exacta en segundos.\n  * Verifica la presencia conjunta del átomo de índice de fotogramas (`moov`) y el flujo continuo de audio/video (`mdat`), descartando contenedores corruptos que no sean reproducibles.\n* **RIFF / WAV / WebP / AVI:**\n  * Interpreta cabeceras RIFF (`Resource Interchange File Format`) de 12 bytes: `RIFF` (4B) + `TamañoArchivo - 8` (4B Little Endian) + `Formato` (4B).\n  * En archivos WAV, extrae canales de audio, frecuencia de muestreo (Hz) y bits por muestra.\n  * En WebP, valida bloques de compresión con pérdida (`VP8`), sin pérdida (`VP8L`) y cabeceras extendidas (`VP8X`).\n* **Documentos OOXML y ODF (ZIP Estructural):**\n  * Detecta firmas de cabecera local `PK\\x03\\x04` y rastrea hacia el final del flujo el registro de directorio central `EOCD` (`PK\\x05\\x06`).\n  * Inspecciona el índice interno sin extraer en disco para clasificar el documento:\n    * `word/document.xml` $\\rightarrow$ Microsoft Word (`.docx`).\n    * `xl/workbook.xml` $\\rightarrow$ Microsoft Excel (`.xlsx`).\n    * `ppt/presentation.xml` $\\rightarrow$ Microsoft PowerPoint (`.pptx`).\n    * `mimetype` con `application/vnd.oasis.opendocument.*` $\\rightarrow$ LibreOffice (`.odt`, `.ods`, `.odp`).\n  * Extrae muestras de texto real desde los nodos XML para verificar legibilidad y generar previsualizaciones directas.\n\n### 1.3 Copias de Sombra de Volumen VSS (`core/shadow_explorer.py`)\n* **Principio:** Windows crea instantáneas a nivel de bloque (Volume Shadow Copies) antes de actualizaciones críticas, puntos de restauración o mediante el servicio de Historial de Archivos.\n* **Utilidad Forense:** Si un archivo fue modificado, infectado por ransomware o sobreescrito intencionalmente en el volumen en vivo, el motor consulta las instantáneas VSS para extraer la versión previa íntegra del archivo a partir de los bloques diferenciales preservados en el almacenamiento de instantáneas (`System Volume Information`).\n\n### 1.4 Papelera Forense y Rescate de Huérfanos (`core/recycle_bin.py`)\n* **Estructura:** Analiza carpetas ocultas `$Recycle.Bin\\<SID_Usuario>\\`.\n* **Pares de Archivos:**\n  * `$I<ID_Aleatorio>.<ext>`: Archivo de cabecera de metadatos (tamaño 544 bytes en Windows Vista/7 o variable en Windows 10/11). Contiene la ruta original completa codificada en UTF-16, fecha exacta de eliminación en formato FILETIME y tamaño original del archivo.\n  * `$R<ID_Aleatorio>.<ext>`: Contenedor físico con los datos reales del archivo.\n* **Rescate de Huérfanos `$R`:** Si el usuario o una herramienta de limpieza (como CCleaner) borró los índices `$I`, el motor escanea los contenedores `$R` huérfanos, analiza sus números mágicos y determina su tipo y contenido, recuperando archivos que otros programas dan por perdidos.\n\n### 1.5 Extractor de Windows Thumbcache (`core/thumbcache_extractor.py`)\n* **Ubicación:** `%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer\\thumbcache_*.db`.\n* **Utilidad Forense:** Windows almacena copias de mapa de bits de todas las imágenes vistas en el explorador en resoluciones de 32, 96, 256, 1024, 1280, 1920 y hasta 2560 píxeles.\n* **Procedimiento:** Parsea la estructura de registros de la base de datos binaria `thumbcache`, extrae el encabezado y volcado JPEG/PNG de cada miniatura. Permite recuperar evidencia fotográfica crucial aun después del formateo rápido de particiones secundarias o sobreescritura del archivo original.\n\n### 1.6 Borradores de Office y Archivos Temporales (`core/temp_scanner.py`)\n* **Rastreo:** Inspecciona `%TEMP%`, `%LOCALAPPDATA%\\Temp`, `%APPDATA%\\Microsoft\\Word`, etc.\n* **Archivos AutoRecover:** Localiza archivos `.asd` (AutoRecuperación de Word), `.wbk` (Respaldos automáticos de Word), `.xar` (AutoRecuperación de Excel) y archivos temporales de escritura atómica con cabeceras OLE2/OOXML que los usuarios no alcanzaron a guardar antes de cortes de energía o caídas del sistema.\n\n---\n\n## 2. Métricas de Integridad y Diagnóstico Forense\n\nEl módulo `core/integrity_analyzer.py` aplica fórmulas estadísticas para evaluar cada hallazgo:\n\n### 2.1 Ratio de Bytes Nulos\nCalcula la proporción de bytes con valor cero (`0x00`) en la muestra inicial:\n$$\\text{Null Ratio} = \\frac{\\text{Conteo de } 0x00}{\\text{Longitud de Muestra}}$$\n* **Interpretación:** Si $\\text{Null Ratio} > 0.85$ (más del 85% de ceros), se clasifica como bloque desasignado o sector libre borrado por el sistema operativo. Se descarta automáticamente con estado `🔴 Inútil (5%)`.\n\n### 2.2 Entropía de Información de Shannon\nCalcula el nivel de aleatoriedad o sorpresa en la distribución de frecuencias de los bytes:\n$$H(X) = -\\sum_{i=0}^{255} P(x_i) \\log_2 P(x_i)$$\n* **$H(X) \\approx 0.0$ bits/byte:** Patrones altamente repetitivos (secuencias continuas de `0x00`, `0xFF` o caracteres idénticos). Basura lógica.\n* **$3.5 < H(X) < 5.5$ bits/byte:** Texto plano legible, código fuente, XML, JSON, código máquina no comprimido.\n* **$7.0 < H(X) < 8.0$ bits/byte:** Datos con compresión matemática eficiente o cifrado (imágenes JPEG, archivos ZIP/RAR/7Z, video MP4, flujos HTTPS/TLS).\n\n---\n\n## 3. Metodología de Intervención en Discos Inestables\n\nCuando se trabaja con discos duros mecánicos con sectores defectuosos (*bad sectors*), unidades con cabezales inestables o memorias flash degradadas:\n\n1. **Minimizar Desplazamientos Mecánicos (*Head Thrashing*):**\n   * Active el **Filtro de Software y Juegos (`SoftwareFilter`)**: Omitirá decenas de miles de archivos irrelevantes de programas instalados, reduciendo el estrés físico del cabezal de lectura en más de un 80%.\n   * Utilice **Indexación Dirigida o Selector Manual**: Limite la búsqueda exclusivamente a las carpetas donde se encontraban los datos sensibles.\n2. **Escaneos Incrementales con Persistencia de Sesiones:**\n   * Si el disco corre riesgo inminente de fallo físico, realice búsquedas por fases (ej. primero Documentos, guarde la sesión en `sessions/`; luego Fotos).\n   * La función de **Escaneo Incremental** en `SessionManager` calculará huellas digitales (*fingerprints*) y no volverá a leer clusters de archivos ya identificados.\n3. **Regla Estricta de Escritura:**\n   * La unidad bajo análisis se debe montar siempre en modo de **solo lectura**.\n   * El directorio de guardado debe ser una unidad física externa independiente con capacidad suficiente para albergar el volumen total recuperado.\n\n---\n\n## 4. Cadena de Custodia y Auditoría Criptográfica\n\nPara garantizar la validez pericial de los archivos recuperados:\n* Al ejecutar la exportación mediante `RecoveryExporter`, el sistema calcula el hash criptográfico **SHA-256** de cada archivo restaurado.\n* Se genera un archivo de auditoría `recovery_audit_log.txt` con marcas de tiempo ISO-8601, ruta original, método de procedencia y firma hash, permitiendo contrastar la integridad de la evidencia en sede judicial.\n\n"}, "arquitectura": {"id": "arquitectura", "title": "Arquitectura & Código", "icon": "🏛️", "badge": "Estructura", "markdown": "# 🏛️ Arquitectura del Sistema y Estructura del Código\n\nEste documento describe en profundidad la arquitectura técnica, los lenguajes de programación, las tecnologías y dependencias utilizadas, así como la estructura completa del árbol de archivos del **Recuperador de Datos Forense (Forensic Data Recovery Suite)**.\n\n---\n\n## 1. Lenguajes y Tecnologías Utilizadas\n\n| Componente / Capa | Tecnología / Lenguaje | Propósito y Función |\n|---|---|---|\n| **Lenguaje Central** | **Python 3.10 - 3.14** | Lenguaje de desarrollo principal. Se aprovecha su tipado estático opcional (`typing`), manejo nativo de flujos binarios (`io`, `struct`, `bytes`) y concurrencia segura con hilos de ejecución. |\n| **Framework de Interfaz Gráfica** | **PyQt5 (Qt 5.15+)** | Construcción de la interfaz de usuario de alto rendimiento con aceleración por hardware, escalado automático High-DPI (`AA_EnableHighDpiScaling`), renderizado de video (`QtMultimedia`, `QVideoWidget`) y estilos visuales QSS basados en temas oscuros modernos. |\n| **Capa de Persistencia Relacional** | **SQLite 3 (Embebido)** | Base de datos local transaccional (`data/recovery_vault.db`) autoconstruida mediante DDL relacional. Almacena el catálogo de software indexado, historiales de auditoría y metadatos de configuración sin requerir servicios externos. |\n| **Serialización de Sesiones** | **JSON + Base64 RFC 4648** | Sistema de guardado y carga de sesiones de exploración (`sessions/*.json`), permitiendo reanudar hallazgos entre reinicios de sistema sin reescanear discos físicos. Incluye codificación Base64 para muestras binarias de previsualización. |\n| **Interoperabilidad de Bajo Nivel** | **Ctypes / Win32 API / Native CLI** | Interacción con APIs del kernel de Windows: verificación de privilegios UAC (`Shell32.IsUserAnAdmin`), detección de volúmenes NTFS/FAT32/exFAT (`GetVolumeInformationW`, `GetDiskFreeSpaceExW`), e invocación segura de herramientas del sistema (`vssadmin` para Shadow Copies). |\n| **Compatibilidad Multiplataforma** | **POSIX / Linux XDG / FreeDesktop** | Abstracción de sistema operativo que permite ejecutar la suite en **Linux (Bazzite, Debian, Ubuntu, Fedora, SteamOS)**, leyendo puntos de montaje desde `/proc/mounts`, papelera FreeDesktop en `~/.local/share/Trash` y variables XDG de usuario. |\n| **Procesamiento Gráfico Forense** | **Pillow (PIL 10+)** | Análisis de dimensiones, resolución de imágenes (2K/4K/8K), decodificación de metadatos EXIF fotográficos, y generación dinámica de miniaturas en memoria para el visor visual interactivo. |\n| **Compilador y Empaquetador** | **PyInstaller (6.0+)** | Generación de ejecutables autónomos portables (`RecuperadorDeDatos.exe` en Windows y binario ELF nativo en Linux) que empaquetan el intérprete de Python, las bibliotecas C++ compartidas y las dependencias gráficas en un archivo único independiente. |\n| **Scripts de Automatización** | **PowerShell, Windows Batch (.bat), Bash (.sh)** | Lanzadores estándar, lanzadores con elevación de privilegios UAC y scripts de compilación desatendida. |\n\n---\n\n## 2. Diagrama de Arquitectura del Software\n\n```mermaid\ngraph TD\n    subgraph UI [\"Capa de Presentación e Interfaz (PyQt5)\"]\n        MW[MainWindow] --> IB[InfoBar HUD Telemetría]\n        MW --> SP[ScanPanel Selector y Filtros]\n        MW --> RT[ResultsTable Tabla y Checkboxes]\n        MW --> PW[PreviewWidget Visor Forense 5 Pestañas]\n        MW --> SD[SessionDialog Gestor de Sesiones]\n        SP --> PD[Popups Dialogs: Tipos, Protocolos, Carpetas]\n    end\n\n    subgraph WORKERS [\"Capa Asíncrona Concurrente (QThread)\"]\n        SW[ScanWorker Hilo de Escaneo]\n        EW[ExportWorker Hilo de Restauración]\n    end\n\n    subgraph CORE [\"Motores Lógicos y Forenses (core/)\"]\n        DU[disk_utils Detección de Discos]\n        CR[context_router Ruteo por Formato]\n        SF[software_filter Exclusión de Juegos]\n        IA[integrity_analyzer Calidad y Entropía]\n        FC[file_carver Carving Estructural]\n        RB[recycle_bin Papelera e Índices $I/$R]\n        MS[mft_scanner Analizador NTFS MFT]\n        SE[shadow_explorer Copias de Sombra VSS]\n        TE[thumbcache_extractor Caché Gráfica]\n        TS[temp_scanner Borradores Office y Temp]\n        SM[session_manager Persistencia JSON]\n        EX[exporter Restaurador de Árbol y Nombres]\n    end\n\n    subgraph STORAGE [\"Capa de Almacenamiento Local y Físico\"]\n        DB[(recovery_vault.db SQLite)]\n        SESS[(Carpeta sessions/ JSON)]\n        RAW[Sectores Físicos / Volúmenes HDD/SSD/USB]\n        DEST[Directorio de Destino Seguro]\n    end\n\n    MW --> SW\n    MW --> EW\n    SW --> CORE\n    EW --> EX\n    EX --> DEST\n    CORE --> RAW\n    SM --> SESS\n    SF --> DB\n```\n\n---\n\n## 3. Estructura Exhaustiva de Carpetas y Módulos\n\n```\nRECUPERADOR DE DATOS/\n├── main.py                         # Punto de entrada principal con detección High-DPI y arranque\n├── build_exe.py                    # Compilador automatizado a ejecutable único (.exe) para Windows\n├── build.bat                       # Script por lotes para compilar con un solo doble clic en Windows\n├── build_linux.sh                  # Script Bash para compilar binario nativo en Linux/Debian/Bazzite\n├── run.bat                         # Lanzador en modo usuario estándar\n├── run_as_admin.bat                # Lanzador con elevación UAC de Administrador para Windows\n├── run_linux.sh                    # Lanzador para distribuciones Linux\n├── requirements.txt                # Lista de librerías requeridas (PyQt5, Pillow, pyinstaller)\n├── RecuperadorDeDatos.spec         # Fichero de especificación técnica generado por PyInstaller\n├── RecuperadorDeDatos.desktop      # Acceso directo para el menú de aplicaciones en Linux (KDE/GNOME)\n│\n├── core/                           # Capa de Motores Lógicos y Protocolos Forenses\n│   ├── __init__.py                 # Exportación de módulos centrales\n│   ├── disk_utils.py               # Enumeración de discos físicos/lógicos, espacio libre, permisos y formateo\n│   ├── local_db.py                 # Gestor SQLite local con creación automática de tablas e índices\n│   ├── env_checker.py              # Diagnóstico preventivo Win32 (.NET, Visual C++, arquitecturas x64)\n│   ├── integrity_analyzer.py       # Evaluación forense de usabilidad, entropía de Shannon y ratio nulo\n│   ├── file_carver.py              # Motor de tallado estructural con validación matemática de longitud\n│   ├── mft_scanner.py              # Analizador de Master File Table (MFT) en sistemas de archivos NTFS\n│   ├── shadow_explorer.py          # Extractor de instantáneas de volumen (Volume Shadow Copies - VSS)\n│   ├── recycle_bin.py              # Parser de Papelera Forense ($Recycle.Bin), registros $I y huérfanos $R\n│   ├── thumbcache_extractor.py     # Extractor de fotos en alta resolución desde bases de datos thumbcache\n│   ├── temp_scanner.py             # Escáner de borradores no guardados de Office (.asd, .wbk) y temporales\n│   ├── session_manager.py          # Gestor de persistencia de sesiones, huellas digitales y escaneo diferencial\n│   ├── context_router.py           # Ruteo contextual y mapeo inteligente de directorios por tipo de archivo\n│   ├── software_filter.py          # Filtro inteligente de exclusión de software, dependencias y videojuegos\n│   └── exporter.py                 # Motor de exportación segura, reconstrucción de árbol y verificación SHA-256\n│\n├── ui/                             # Capa de Interfaz Gráfica de Usuario (PyQt5)\n│   ├── __init__.py                 # Inicializador de paquete UI\n│   ├── main_window.py              # Ventana principal, orquestación de eventos, HUD y seguridad al exportar\n│   ├── info_bar.py                 # Barra HUD de telemetría en tiempo real (velocímetro, cronómetro, contadores)\n│   ├── scan_panel.py               # Panel lateral de configuración de escaneo, alcance y protocolos\n│   ├── popups.py                   # Diálogos emergentes: FileTypesDialog, FolderChecklistDialog, etc.\n│   ├── results_table.py            # Tabla interactiva con badges de calidad, ordenamiento numérico y filtros\n│   ├── preview_widget.py           # Visor multi-pestaña (Imagen con zoom/pan, Video/Audio, Texto, HexDump, Metadatos)\n│   ├── session_dialog.py           # Diálogo de gestión, carga, nombrado y borrado de sesiones previas\n│   ├── directory_selector.py       # Selector de alcance (Indexación dirigida, manual o unidad entera)\n│   ├── worker.py                   # Hilos asíncronos QThread (ScanWorker para análisis, ExportWorker para volcado)\n│   └── theme.py                    # Hoja de estilos Qt QSS con paleta oscura profesional (GitHub Dark inspirada)\n│\n├── data/                           # Directorio de persistencia local\n│   └── recovery_vault.db           # Base de datos SQLite local autoconstruida\n│\n├── sessions/                       # Catálogo de sesiones guardadas\n│   └── *.recovery_session.json     # Archivos JSON estructurados con resultados, huellas y muestras base64\n│\n├── dist/                           # Salida de ejecutables compilados\n│   ├── RecuperadorDeDatos.exe      # Ejecutable portable 100% autónomo para Windows (256 MB)\n│   └── RecuperadorDeDatos          # Binario ELF nativo para Linux (cuando se compila en Linux)\n│\n├── docs/                           # Documentación oficial del proyecto\n│   ├── ARQUITECTURA_Y_ESTRUCTURA.md # Este documento de arquitectura técnica\n│   ├── CHANGELOG.md                # Registro de cambios cronológico detallado\n│   ├── COMPILACION_Y_DISTRIBUCION.md # Guía para compilar ejecutables en Windows y Linux\n│   ├── MANUAL_USUARIO_COMUN.md     # Guía paso a paso para usuarios finales\n│   ├── MANUAL_TECNICO_Y_FORENSE.md # Manual especializado para técnicos y peritos\n│   └── MANUAL_DESARROLLADOR_Y_PORTING.md # Guía para programadores y adaptaciones multiplataforma\n│\n└── tests/                          # Batería de pruebas automatizadas\n    └── test_core.py                # 9 suites de pruebas forenses y de integración central\n```\n\n---\n\n## 4. Descripción Funcional de los Módulos Principales\n\n### 4.1 Módulos Centrales (`core/`)\n\n* **`file_carver.py`**: Motor de tallado binario estructural. En lugar de limitarse a buscar cadenas de bytes iniciales, implementa parsers específicos que interpretan la especificación formal del formato para calcular la longitud en bytes exacta del archivo:\n  * *JPEG*: Recorre marcadores `SOI`, `APPx`, `DQT`, `DHT`, `SOF0/2` y el flujo `SOS` omitiendo miniaturas EXIF para no cortar la imagen prematuramente.\n  * *PNG*: Valida matemáticamente cada chunk mediante CRC32 hasta encontrar el bloque final `IEND`.\n  * *MP4 / MOV*: Navega la jerarquía de cajas ATOM (`ftyp`, `moov`, `mdat`) y extrae duración y resolución.\n  * *RIFF*: Extrae audio PCM (WAV), imágenes WebP (VP8/VP8L/VP8X) y video AVI delimitando el tamaño exacto.\n  * *ZIP / OOXML / ODF*: Detecta firmas `PK\\x03\\x04`, parsea el directorio central (`EOCD`) y diferencia documentos Word (`.docx`), Excel (`.xlsx`), PowerPoint (`.pptx`), LibreOffice (`.odt`, `.ods`, `.odp`) y libros digitales (`.epub`).\n  * *Identificadores Criptográficos*: Cada elemento tallado recibe un ID unívoco mediante hash MD5 (`carved_{md5}`), evitando colisiones de selección en la interfaz.\n\n* **`integrity_analyzer.py`**: Analizador de viabilidad forense. Aplica análisis estadístico y estructural a cada archivo antes de presentarlo al usuario:\n  * *Ratio de bytes nulos (`0x00`)*: Si supera el 85%, califica el archivo como sector borrado o bloque nulo (puntaje $\\le 5\\%$, estado `🔴 Inútil`).\n  * *Entropía de Shannon*: Evalúa la distribución aleatoria de la información binaria para descartar ruido sin estructura.\n  * *Validación de dimensiones y duración*: Penaliza iconos diminutos del sistema ($\\le 64\\times 64$) y microfragmentos multimedia ($< 1$ segundo), premiando archivos útiles en alta definición.\n  * *Calificación en 4 niveles*: 🌟 Alta Calidad ($\\ge 80\\%$), 🟡 Media ($\\ge 50\\%$), 🟠 Baja ($\\ge 20\\%$) y 🔴 Inútil ($< 20\\%$).\n\n* **`local_db.py`**: Abstracción sobre SQLite 3. Asegura que el archivo `data/recovery_vault.db` se cree automáticamente en la primera ejecución con tablas e índices optimizados:\n  * `sessions`: Registro histórico de sesiones de búsqueda.\n  * `recovered_items`: Detalle de elementos recuperados y sus metadatos.\n  * `software_catalog`: Rutas de juegos y programas instalados para exclusión inmediata.\n  * `export_audit`: Registro de auditoría de restauraciones realizadas con firmas SHA-256.\n  * `app_config`: Claves y valores de configuración del usuario.\n\n* **`env_checker.py`**: Verificador de dependencias del sistema operativo antes de inicializar la interfaz Qt. Si detecta la falta de librerías C++ Redistributable o .NET en Windows, despliega una alerta nativa Win32 (mediante `ctypes.windll.user32.MessageBoxW`) con hipervínculos de descarga oficial.\n\n* **`mft_scanner.py`**: Analizador forense de la tabla maestra de archivos (MFT) en volúmenes NTFS. Parsea registros de 1024 bytes buscando la firma `FILE`, analiza cabeceras de atributos (`$STANDARD_INFORMATION`, `$FILE_NAME`, `$DATA`), y recupera nombres de archivo originales, marcas temporales y datos residentes sin depender de que el archivo exista en el explorador.\n\n* **`shadow_explorer.py`**: Gestor de Copias de Sombra de Volumen (Volume Shadow Copies - VSS). Consulta instantáneas creadas por Windows y permite restaurar versiones previas de archivos que fueron modificados o sobreescritos.\n\n* **`recycle_bin.py`**: Parser profundo de la papelera de reciclaje (`$Recycle.Bin`). Asocia archivos de metadatos `$I` (que conservan nombre original, fecha de eliminación y tamaño) con sus respectivos contenedores `$R`. Adicionalmente, cuenta con un algoritmo de rescate de huérfanos `$R` que identifica el tipo de archivo mediante números mágicos si los índices `$I` fueron eliminados.\n\n* **`thumbcache_extractor.py`**: Extractor de imágenes en alta definición (hasta 1080p y 4K) contenidas en los ficheros de base de datos `thumbcache_*.db` de Windows Explorer. Permite rescatar fotos familiares o de trabajo aun cuando el archivo original en disco haya sido completamente sobreescrito.\n\n* **`temp_scanner.py`**: Localizador especializado en archivos de trabajo no guardados y borradores automáticos de suites ofimáticas (Microsoft Word `.asd`, Excel `.xar`, temporales `.tmp` con firma válida y respaldos `.wbk`).\n\n* **`session_manager.py`**: Administrador de persistencia en formato JSON. Incluye cálculo de huellas digitales (*fingerprints*) para permitir escaneos incrementales y diferenciales, omitiendo archivos conocidos sin cambios y fusionando novedades.\n\n* **`context_router.py`**: Enrutador heurístico que asocia las categorías buscadas (Documentos, Imágenes, Audio, Video, etc.) con los directorios donde habitualmente residen, acelerando el escaneo al omitir carpetas no pertinentes.\n\n* **`software_filter.py`**: Catálogo inteligente que consulta el Registro de Windows y carpetas típicas (`C:\\Games`, Steam, Epic, etc.) para excluir miles de archivos irrelevantes de juegos y aplicaciones (texturas, shaders, DLLs, paquetes `.pak`), ahorrando hasta un 85% de tiempo de análisis.\n\n* **`exporter.py`**: Motor de restauración a disco. Dispone de opciones para preservar nombres reales originales, reconstruir el árbol de directorios original (jerarquía de carpetas y subcarpetas) y generar un reporte de auditoría forense con hashes criptográficos SHA-256.\n\n---\n\n### 4.2 Módulos de Interfaz Gráfica (`ui/`)\n\n* **`main_window.py`**: Ventana principal del sistema. Conecta los paneles, coordina los hilos asíncronos y contiene los mecanismos de seguridad al exportar (advertencia de misma unidad física y confirmación selectiva de archivos visibles frente a selecciones ocultas).\n* **`info_bar.py`**: Barra de telemetría (HUD) superior. Muestra cronómetro de análisis, velocímetro en megabytes por segundo, volumen total procesado y desgloses de hallazgos por categoría en tiempo real.\n* **`popups.py`**: Diálogos modales desplegables compactos (`FileTypesDialog`, `FolderChecklistDialog`, `ProtocolDialog`) que reemplazan controles invasivos, manteniendo una interfaz limpia y profesional. Contiene los catálogos exhaustivos de 82 formatos categorizados.\n* **`results_table.py`**: Tabla de presentación de resultados. Soporta ordenamiento numérico real (por bytes y porcentaje de calidad), filtrado interactivo por texto, categoría, extensión y calidad, badges visuales en color y cálculo transparente de estadísticas (archivos visibles vs. lote global).\n* **`preview_widget.py`**: Panel de previsualización integral con 5 pestañas:\n  1. *Vista Gráfica*: Zoom libre (10% a 800%), paneo, lectura de metadatos EXIF fotográficos.\n  2. *Multimedia*: Reproductor audiovisual integrado (`QMediaPlayer` + `QVideoWidget`) con barra de progreso deslizable.\n  3. *Texto / Documentos*: Extracción y visualización de texto legible en documentos Office, código y texto plano.\n  4. *Volcado Hexadecimal*: Vista estilo editor hexadecimal con panel ASCII, detección de firmas mágicas y cálculo de entropía de Shannon.\n  5. *Metadatos y Hash*: Tabla detallada de especificaciones técnicas y cálculo de SHA-256 bajo demanda.\n* **`worker.py`**: Implementación de concurrencia mediante `QThread` (`ScanWorker` y `ExportWorker`), garantizando que la interfaz nunca se congele durante el análisis de gigabytes de datos en disco.\n* **`theme.py`**: Definición central de la hoja de estilos Qt QSS con paleta oscura de alto contraste, garantizando una estética moderna en cualquier resolución.\n\n"}, "compilacion": {"id": "compilacion", "title": "Compilación & Distribución", "icon": "🔨", "badge": "DevOps", "markdown": "# 🔨 Guía de Compilación, Empaquetado y Distribución\n\nEsta guía detalla el procedimiento técnico para compilar el **Recuperador de Datos Forense** en ejecutables autónomos y portables tanto para **Windows (.exe)** como para **Linux (ELF)**, sin necesidad de que los usuarios finales instalen Python, PyQt5 ni dependencias externas.\n\n---\n\n## 1. Compilación para Windows (.exe)\n\n### 1.1 Requisitos Previos en el Entorno de Compilación\nPara compilar el binario en Windows, el equipo de desarrollo debe contar con:\n* **Python 3.10, 3.11, 3.12, 3.13 o 3.14 (64 bits)** instalado.\n* Paquetes de Python requeridos (instalables vía `pip`):\n  ```powershell\n  pip install pyinstaller PyQt5 Pillow\n  ```\n\n### 1.2 Métodos de Compilación en Windows\n\n#### Método 1: Doble Clic con `build.bat` (Recomendado)\nEn el explorador de archivos de Windows, haga doble clic en:\n```\nbuild.bat\n```\nEl script validará el entorno, limpiará compilaciones temporales previas y ejecutará `build_exe.py`.\n\n#### Método 2: Desde Consola PowerShell / CMD\nAbra una terminal en la raíz del proyecto y ejecute:\n```powershell\npython build_exe.py\n```\n\n### 1.3 Parámetros Avanzados de Compilación (`build_exe.py`)\n\n| Parámetro / Argumento | Descripción y Uso |\n|---|---|\n| *(Sin parámetros)* | Genera un archivo ejecutable único (`--onefile`), en modo ventana sin consola negra (`--noconsole`). El resultado se ubica en `dist/RecuperadorDeDatos.exe`. |\n| `--debug` | Habilita la consola de depuración en segundo plano (`--console`). Útil para diagnosticar excepciones no capturadas o inspeccionar trazas de error en tiempo real. |\n| `--onedir` | Empaqueta la aplicación en una carpeta con archivos sueltos en lugar de un único ejecutable comprimido. Acelera el tiempo de arranque inicial en máquinas con discos lentos. |\n\nEjemplos:\n```powershell\n# Compilación estándar para distribución a usuarios:\npython build_exe.py\n\n# Compilación con consola visible para pruebas y depuración:\npython build_exe.py --debug\n\n# Compilación en carpeta suelta:\npython build_exe.py --onedir\n```\n\n### 1.4 Manejo Automático de Bloqueos de Archivo en Windows\nEn Windows, si el archivo `dist/RecuperadorDeDatos.exe` está siendo ejecutado o se encuentra bloqueado por el explorador de archivos, PyInstaller suele fallar con error de permisos (`PermissionError: [WinError 5] Acceso denegado`).\n\n`build_exe.py` cuenta con un mecanismo de protección integrado:\n1. Intenta eliminar el binario anterior.\n2. Si está bloqueado, lo renombra automáticamente a un archivo temporal de respaldo (`RecuperadorDeDatos_old_<timestamp>.exe`), liberando inmediatamente la ruta `RecuperadorDeDatos.exe` para que PyInstaller complete la compilación sin errores.\n\n### 1.5 Resultado del Binario de Windows\n* **Ruta de salida:** `dist/RecuperadorDeDatos.exe`\n* **Tamaño aproximado:** ~256 MB (incluye Python completo, DLLs de Qt5, plugins de plataforma `qwindows.dll`, códecs multimedia y SQLite).\n* **Portabilidad:** 100% autónomo. Puede copiarse a una memoria USB y ejecutarse en cualquier equipo con Windows 10 u 11 de 64 bits.\n\n---\n\n## 2. Compilación y Exportación para Linux\n\nLa suite está diseñada con una capa de abstracción compatible con **Linux Bazzite, Debian, Ubuntu, Fedora y SteamOS**.\n\n### 2.1 Opción A: Compilación Nativa ELF con `build_linux.sh`\nPara generar un binario nativo de Linux (sin extensión `.exe`):\n\n1. Otorgue permisos de ejecución al script:\n   ```bash\n   chmod +x build_linux.sh\n   ```\n2. Ejecute la compilación:\n   ```bash\n   ./build_linux.sh\n   ```\n3. El script creará un entorno virtual aislado (`.venv_linux_build`), instalará las librerías necesarias y generará el ejecutable:\n   ```bash\n   dist/RecuperadorDeDatos\n   ```\n4. Para ejecutarlo:\n   ```bash\n   ./dist/RecuperadorDeDatos\n   ```\n\n### 2.2 Opción B: Compilación en Bazzite mediante Distrobox\nDado que **Linux Bazzite** es un sistema inmutable (basado en Fedora Atomic con rpm-ostree), se recomienda compilar utilizando el subsistema **Distrobox** incluido por defecto:\n\n```bash\n# 1. Crear e ingresar a un contenedor Debian o Fedora para desarrollo:\ndistrobox create -i debian:latest -n dev-recuperador\ndistrobox enter dev-recuperador\n\n# 2. Instalar dependencias del sistema requeridas para compilar PyQt5:\nsudo apt update && sudo apt install -y python3 python3-pip python3-venv libgl1 libegl1 libglib2.0-0\n\n# 3. Compilar el ejecutable nativo:\nchmod +x build_linux.sh\n./build_linux.sh\n```\n\n### 2.3 Opción C: Ejecución Inmediata en Bazzite vía Wine / Proton\nDado que Bazzite incluye **Wine** y **Proton** preinstalados de fábrica para videojuegos:\n* Puede copiar directamente `dist/RecuperadorDeDatos.exe` a Bazzite y hacer clic derecho → **\"Abrir con Wine\"**.\n* O ejecutarlo desde la terminal:\n  ```bash\n  wine dist/RecuperadorDeDatos.exe\n  ```\n\n---\n\n## 3. Integración en el Escritorio (Desktop Entry)\n\nPara integrar la aplicación en el menú del sistema operativo en Linux:\n\n1. El archivo `RecuperadorDeDatos.desktop` se encuentra en la raíz del proyecto.\n2. Cópielo a la carpeta de aplicaciones del usuario:\n   ```bash\n   mkdir -p ~/.local/share/applications\n   cp RecuperadorDeDatos.desktop ~/.local/share/applications/\n   ```\n3. La aplicación aparecerá en el menú de KDE Plasma, GNOME y lanzadores de Bazzite.\n\n---\n\n## 4. Estructura de Archivos Necesaria para Distribución Portátil\n\nSi va a distribuir la herramienta en una memoria USB o compartirla en red, solo necesita copiar los siguientes elementos:\n\n```\nCarpeta_Distribucion/\n└── RecuperadorDeDatos.exe    # El ejecutable único autónomo\n```\n\nAl ejecutarse, la aplicación generará automáticamente en su propio directorio:\n* `data/recovery_vault.db`: Base de datos SQLite local para historiales y caché.\n* `sessions/`: Directorio donde se guardan las sesiones de exploración en formato JSON.\n\nNo requiere la presencia de código fuente `.py`, carpetas virtuales ni archivos de configuración externos.\n\n"}, "desarrollo": {"id": "desarrollo", "title": "Desarrollador & Porting", "icon": "💻", "badge": "Programadores", "markdown": "# 💻 Manual de Desarrollo y Guía de Portabilidad\n\nEsta guía está diseñada para **desarrolladores de software, ingenieros de sistemas y contribuidores** que deseen ampliar las capacidades de la suite, agregar nuevos formatos de archivo, implementar parsers estructurales o portar la herramienta a otros sistemas operativos (como macOS, FreeBSD o distribuciones embebidas de Linux).\n\n---\n\n## 1. Principios de Diseño y Arquitectura de Código\n\nEl proyecto sigue una arquitectura modular desacoplada:\n* **`core/` (Lógica Pura y Forense):** Módulos independientes de la interfaz gráfica. No deben importar ningún componente de `PyQt5`. Trabajan exclusivamente con tipos de datos estándar de Python (`dict`, `list`, `bytes`, `typing`), lo que facilita pruebas unitarias automatizadas y ejecuciones en modo consola/CLI.\n* **`ui/` (Presentación Qt):** Consume las clases de `core/` a través de hilos de trabajo asíncronos (`worker.py`). Toda comunicación entre la lógica intensiva y la interfaz se realiza mediante el sistema de **Señales y Slots (`pyqtSignal`)**, garantizando que el hilo principal de la UI (`MainThread`) mantenga una tasa de 60 FPS sin bloqueos.\n* **Inmutabilidad de Fuentes:** Los motores de lectura siempre deben abrir archivos y flujos de disco en modo binario de solo lectura (`\"rb\"`). **Bajo ninguna circunstancia se debe escribir en los volúmenes analizados.**\n\n---\n\n## 2. Arquitectura de Hilos Asíncronos (`ui/worker.py`)\n\nLa clase `ScanWorker(QThread)` encapsula la ejecución del escaneo en segundo plano:\n\n```python\nclass ScanWorker(QThread):\n    telemetry_updated = pyqtSignal(str, int, int, int, str) # msg, pct, count, bytes, target\n    finished_scan = pyqtSignal(list)                        # items encontrados\n    error_occurred = pyqtSignal(str)                        # mensaje de error\n```\n\n### Ciclo de Telemetría:\n1. El hilo reporta periódicamente a través de `telemetry_updated`.\n2. La señal se conecta con `InfoBar.update_status()` en `main_window.py`.\n3. `InfoBar` recalcula dinámicamente el tiempo transcurrido, velocidad en MB/s y contadores por categoría.\n\n---\n\n## 3. Guía Paso a Paso: Cómo Agregar un Nuevo Formato de Archivo\n\nSupongamos que deseas agregar soporte para archivos de modelo 3D **Blender (`.blend`)**.\n\n### Paso 1: Registrar el formato en el catálogo de UI (`ui/popups.py`)\nAbre `ui/popups.py` y agrega la definición en la categoría correspondiente (o una nueva):\n```python\n# En DOCUMENT_FORMAT_CATALOG o en una nueva lista:\n{\"ext\": \".blend\", \"label\": \"3D Blender Project\", \"icon\": \"🎨\", \"suite\": \"3D\", \"desc\": \"Proyecto de animación y modelado 3D Blender\"}\n```\n\n### Paso 2: Registrar la extensión en las categorías de Papelera (`core/recycle_bin.py`)\nAbre `core/recycle_bin.py` y añade la extensión a `EXT_CATEGORIES`:\n```python\nEXT_CATEGORIES = {\n    # ...\n    \"Otros\": {..., \".blend\"},\n    # O crea una categoría \"3D\": {\".blend\", \".obj\", \".fbx\", \".stl\"}\n}\n```\n\n### Paso 3: Agregar la firma binaria estática en `core/file_carver.py`\nAbre `core/file_carver.py` y agrégala a `SIGNATURE_CATALOG`:\n```python\n{\n    \"name\": \"Blender 3D Project\", \n    \"ext\": \".blend\", \n    \"cat\": \"Otros\", \n    \"header\": b\"BLENDER\",  # Cabecera mágica de Blender\n    \"footer\": None, \n    \"max\": 500 * 1024 * 1024  # Tamaño máximo razonable (500 MB)\n}\n```\n\n---\n\n## 4. Guía Paso a Paso: Cómo Implementar un Parser Estructural Matemático\n\nSi el nuevo formato tiene una estructura interna navegable (como un contenedor o bloques de longitud variable), es preferible implementar un parser estructural para recuperar el archivo con un 100% de integridad sin basarse en tamaños fijos.\n\n### Estructura de la función en `core/file_carver.py`:\n```python\ndef parse_mi_formato_structure(data: bytes, offset: int) -> Optional[Tuple[int, Dict[str, Any], int, str]]:\n    \"\"\"\n    Analiza la estructura interna del formato.\n    Retorna: (longitud_bytes, diccionario_specs, score_integridad, estado_integridad)\n    o None si la estructura está corrompida.\n    \"\"\"\n    if len(data) - offset < 8:\n        return None\n    \n    # 1. Validar Magic Bytes\n    if data[offset:offset+4] != b\"MI_MAGIC\":\n        return None\n    \n    # 2. Leer longitud declarada en cabecera (Big-Endian o Little-Endian)\n    file_size = struct.unpack(\"<I\", data[offset+4:offset+8])[0]\n    \n    # 3. Validar consistencia matemática\n    if file_size <= 8 or file_size > 200 * 1024 * 1024:\n        return None\n        \n    specs = {\"format\": \"MI_FORMATO\", \"version\": 1}\n    score = 100\n    status = \"Íntegro (100%)\"\n    \n    return file_size, specs, score, status\n```\n\nLuego, en el bucle principal de `scan_stream()`, se invoca la función para delimitar el archivo exacto.\n\n---\n\n## 5. Guía de Portabilidad a Otros Sistemas Operativos\n\nLa suite está diseñada para ser portable con mínimos cambios:\n\n```mermaid\ngraph LR\n    SUB[Capa de Abstracción de SO] --> WIN[Windows: Win32 API, UAC, VSS, MFT]\n    SUB --> LNX[Linux: /proc/mounts, FreeDesktop Trash, XDG]\n    SUB --> MAC[macOS: mount, .Trash, Cocoa/Carbon]\n```\n\n### 5.1 Enumeración de Discos (`core/disk_utils.py`)\nActualmente implementa dos ramas:\n* **Windows:** Utiliza `ctypes.windll.kernel32.GetLogicalDrives()` y `GetVolumeInformationW`.\n* **Linux:** Lee `/proc/mounts` filtrando sistemas de archivos virtuales (`sysfs`, `proc`, `tmpfs`) y detecta particiones en `/run/media/$USER` y `/media`.\n\n**Para portar a macOS:**\nEn macOS, los discos montados se consultan leyendo el directorio `/Volumes/` o ejecutando `diskutil list -plist`:\n```python\nif sys.platform == \"darwin\":\n    volumes = os.listdir(\"/Volumes\")\n    for vol in volumes:\n        vol_path = os.path.join(\"/Volumes\", vol)\n        # Extraer espacio libre con os.statvfs(vol_path)\n```\n\n### 5.2 Papelera de Reciclaje (`core/recycle_bin.py`)\n* **Windows:** `$Recycle.Bin\\<SID>\\$I*` y `$R*`.\n* **Linux:** `~/.local/share/Trash/files/` y `~/.local/share/Trash/info/*.trashinfo`.\n* **macOS:** `~/.Trash` para la papelera de usuario y `/.Trashes/<UID>` para volúmenes secundarios.\n\n### 5.3 Mapeo de Carpetas de Usuario (`core/context_router.py`)\n* En Linux y macOS se utiliza la variable de entorno `$HOME` junto a las rutas estándar XDG / Apple Library (`~/Documents`, `~/Downloads`, `~/Pictures`, `~/Music`, `~/Movies`, `~/Desktop`).\n\n---\n\n## 6. Pruebas Automatizadas y Verificación de Calidad\n\nEl proyecto incluye una amplia batería de pruebas unitarias en `tests/` y `scratch/`:\n\n### 6.1 Ejecutar Suite Central Forense\n```powershell\npython tests/test_core.py\n```\nVerifica:\n1. Enumeración de unidades físicas y detección de permisos de administrador.\n2. Ruteo contextual y sugerencia de carpetas por tipo de archivo.\n3. Catálogo de exclusión de software y juegos (`SoftwareFilter`).\n4. Parser de papelera de reciclaje y extracción de `$R`.\n5. Extracción de fotos desde `thumbcache_*.db`.\n6. File Carving estructural de PNG, JPEG, MP4 y ZIP.\n7. Parser de registros de Master File Table (MFT).\n8. Gestor de sesiones, serialización Base64 y fusión incremental con huellas digitales (*fingerprints*).\n9. Analizador de integridad, ratio de nulos y cálculo de entropía de Shannon.\n\n### 6.2 Ejecutar Suite de Catálogo de 82 Formatos\n```powershell\npython scratch/test_all_category_formats.py\n```\nVerifica que las 4 categorías (Imágenes, Documentos, Multimedia y Comprimidos) mantengan sincronización exacta entre los catálogos de la interfaz y los filtros del motor de escaneo.\n\n### 6.3 Ejecutar Prueba de Selección Aislada y Medidor\n```powershell\npython scratch/test_selection_and_carving_ids.py\n```\nVerifica que al aplicar filtros visuales y pulsar `Solo Visibles`, el medidor de peso aclare la selección sin sumar archivos ocultos en segundo plano.\n\n"}, "changelog": {"id": "changelog", "title": "Registro de Cambios", "icon": "📜", "badge": "v2.5.0", "markdown": "# 📜 Registro Histórico de Cambios (Changelog)\n\nTodos los cambios notables realizados en el proyecto **Recuperador de Datos Forense** se encuentran documentados cronológicamente en este archivo. El formato se basa en [Keep a Changelog](https://keepachangelog.com/es-ES/1.0.0/) y sigue el estándar de versionado semántico [SemVer](https://semver.org/lang/es/).\n\n---\n\n## [2.5.0] - 2026-09-07\n### Añadido\n- **Edición Comercial de Demostración: `Forensic_Recovery_DEMO.exe`**:\n  - Creada una edición portable de evaluación de 24 horas independiente de la versión comercial completa (`RecuperadorDeDatos.exe`).\n  - **Módulo de Licenciamiento Temporal (`TrialManager`)**:\n    - Temporizador inviolable de 24 horas (86,400 segundos) que se activa a partir del primer segundo de ejecución en cada máquina.\n    - **Doble Persistencia con Firma HMAC-SHA256**: Almacena el token de estado de forma redundante en el Registro de Windows (`HKCU\\Software\\ForensicRecoverySuite\\TrialGuard`) y en almacenamiento local protegido (`%LOCALAPPDATA%\\ForensicRecovery\\lic_cache.dat`).\n    - **Vinculación a Firma de Hardware (HWID)**: Integra MachineGuid y hashes de procesador/nodo para prevenir la clonación de tokens entre equipos.\n    - **Protección Anti-Rollback de Reloj**: Detecta retrocesos en la fecha/hora del sistema operativo o BIOS para burlar el temporizador, bloqueando inmediatamente la prueba como manipulada.\n    - **Soporte de Futuras Versiones de Prueba Pre-Comerciales (`CURRENT_DEMO_BUILD_ID`)**:\n      - La compilación actual (Build 1) queda bloqueada permanentemente a las 24 horas y no puede reutilizarse ni resetearse.\n      - Al distribuir una **futura versión de prueba (Beta / Preview)** con un identificador de compilación superior (`Build ID > 1`), el sistema detecta la nueva versión en la misma máquina y le otorga de forma automática su propio ciclo de 24 horas.\n      - Si el usuario intenta ejecutar nuevamente la versión anterior caducada, el bloqueo permanente persiste.\n    - **Clave Maestra y Extensión para Desarrollador**:\n      - Soporte de parámetro por línea de comandos (`--grant-trial-extension=<KEY>`) e ingreso interactivo en el diálogo comercial para autorizar ventanas de prueba adicionales a evaluadores o soporte técnico.\n  - **Banner de Telemetría y Cuenta Regresiva en Tiempo Real (`DemoBanner`)**:\n    - Indicador en la parte superior de la ventana con barra de progreso, horas:minutos:segundos restantes y cambio de alerta a color rojo crítico en la última hora.\n  - **Bloqueo Definitivo y Autodestrucción Segura (`trigger_self_destruction`)**:\n    - Al vencer las 24 horas (o detectarse manipulación), muestra un diálogo explicativo de fin de período de prueba.\n    - Inutiliza de forma irreversible la suite en esa máquina registrando el estado `EXPIRED`.\n    - Programa la eliminación forzada desacoplada del binario `.exe` (`cmd.exe /c timeout /t 2 /nobreak >nul & del /f /q ...`) tras el cierre del proceso.\n  - **Compilación Automatizada (`build_demo.py` & `build.bat`)**:\n    - Script `build_demo.py` para generar directamente `dist/Forensic_Recovery_DEMO.exe`.\n    - Menú interactivo en `build.bat` para compilar la versión Completa, Demo o Ambas con un solo clic.\n\n---\n\n## [2.4.0] - 2026-09-07\n### Añadido\n- **Aislamiento Estricto de Alcance por Unidad (Zero Cross-Drive Leaks)**:\n  - **Papelera Forense Dirigida (`RecycleBinScanner`)**: El escaneo de `$Recycle.Bin` ahora recibe explícitamente la lista de unidades seleccionadas por el usuario (`drives_for_rb`), evitando el barrido indiscriminado de todas las unidades conectadas al sistema (`C:`, `D:`, `E:`, `H:`, etc.).\n  - **Condicionamiento de Caché Gráfica y Temporales a la Unidad de Sistema (`C:`)**: Las fases de extracción de `ThumbcacheExtractor` (fotos en miniatura cacheadas por Windows) y `TempScanner` (borradores de Office y `%TEMP%`) se omiten automáticamente si la unidad de sistema `C:` no forma parte activa del alcance de escaneo.\n  - **Coincidencia Exacta de Sesiones Previas (`SessionManager.find_matching_session`)**: Se reemplazó la validación de subconjunto permisiva (`issubset`) por una comprobación de igualdad estricta (`norm_targets == s_targets`). Esto evita que un escaneo previo multiconector o de otra unidad contamine con sus resultados la sesión de una unidad específica.\n  - **Barrera de Filtrado por Letra de Unidad (`ScanWorker._filter_out_existing_data`)**: Inspecciona exhaustivamente la letra de unidad asignada a través de `drive`, `original_path`, `data_source_path` y `container_file`. Cualquier elemento perteneciente a una unidad ajena al alcance es descartado al 100%.\n  - **Herramienta `[🎯 Solo Esta]` y Aislamiento por Doble Clic en `DirectorySelector`**:\n    - Nuevo botón en la barra de herramientas del selector de carpetas que desmarca cualquier otra carpeta/unidad y deja marcada únicamente la unidad seleccionada.\n    - Doble clic en cualquier elemento del árbol para aislarlo instantáneamente.\n    - Alerta visual en tiempo real en la barra de resumen si el usuario mantiene seleccionadas ubicaciones pertenecientes a discos físicos o letras de unidad distintas.\n\n---\n\n## [2.3.0] - 2026-09-07\n### Añadido\n- **Omisión Total de Archivos Existentes en Unidades**:\n  - Implementado filtro forense estricto `ScanWorker._filter_out_existing_data`: Descarta sistemáticamente cualquier archivo cuyo original se encuentre activo y accesible en el sistema de archivos, coincida en firma `(nombre, tamaño)` con elementos de las carpetas analizadas o haya sido tallado de archivos de usuario activos.\n  - Los resultados solo indexan y muestran elementos genuinamente en estado de recuperación (Papelera de reciclaje `$Recycle.Bin`, registros inactivos/eliminados en NTFS `$MFT`, borradores huérfanos de auto-recuperación, archivos tallados de imágenes de disco o instantáneas VSS).\n- **Restricción de File Carving a Contenedores Forenses**:\n  - `FileCarver.scan_path()` ya no recorre ni abre archivos de usuario activos (`.docx`, `.xlsx`, `.pdf`, `.jpg`, etc.) dentro de las carpetas de alcance.\n  - El tallado de flujo se ejecuta exclusivamente sobre imágenes de disco forenses (`.raw`, `.dd`, `.img`, `.vhd`, `.vhdx`, `.dmp`, `.bin`, `.iso`, `.vmdk`, `.dmg`), volcados de memoria y dispositivos en bruto (`\\\\.\\` / `/dev/`).\n- **Integración de Escaneo Directo NTFS `$MFT` en Protocolo Profundo**:\n  - Nuevo método `MFTScanner.scan_drive_mft()` para consultar directamente la Tabla Maestra de Archivos (NTFS) en busca de entradas con bandera de borrado (`is_in_use == False`) y extraer datos residentes cuando se dispone de permisos de Administrador.\n  - Integrado como Fase 4/5 en el Protocolo Forense Profundo Multicapa.\n- **Depuración de Escaneo de Temporales y Borradores**:\n  - `TempScanner` ahora filtra rigurosamente `%TEMP%` para extraer únicamente borradores huérfanos (`~WRL*.tmp`, `~*.tmp`, `.asd`, `.wbk`, `.xar`, `.bak`), ignorando logs o ficheros activos de instaladores.\n  - Corregida la importación de `re` en `core/temp_scanner.py`.\n\n---\n\n## [2.2.0] - 2026-09-07\n### Añadido\n- **Acción \"Nueva Sesión\" (`Ctrl+N`)**: Botón dedicado `[➕ Nueva Sesión]` en la barra superior de la ventana principal para cerrar escaneos en ejecución y reiniciar el espacio de trabajo.\n- **Limpieza Integral de Estado**: Vacía la memoria de resultados, limpia y reinicia la tabla, desmarca todos los elementos, restablece los filtros de búsqueda/categoría/extensión/calidad, reinicia la vista previa y restablece el HUD de telemetría a \"EN ESPERA\".\n- **Cierre Seguro de Escaneos Activos**: Si el usuario pulsa *Nueva Sesión* durante un escaneo en marcha, el hilo en segundo plano es cancelado y detenido de forma segura antes de limpiar.\n- **Protección de Datos No Guardados**: Diálogo interactivo preventivo que ofrece guardar los resultados de la sesión actual en disco antes de descartarlos.\n- **Purga Total de Historial en Disco (`SessionManager.clear_all_sessions`)**: Nuevo método y botón `[🧹 Purgar Todo...]` en el gestor de sesiones para eliminar en bloque sesiones obsoletas tanto en archivos JSON como en la base de datos SQLite.\n- **Precisión Temporal en Microsegundos**: Generación de identificadores de sesión con resolución a microsegundos (`%Y%m%d_%H%M%S_%f`), previniendo colisiones de sesiones creadas en el mismo segundo.\n\n---\n\n## [2.1.0] - 2026-09-07\n### Añadido\n- **Listado Embebido Directo en Alcance (`DirectorySelector`)**: Se eliminó el menú desplegable (`QComboBox`) de selección de modo y las ventanas modales emergentes para mostrar directamente en el panel un listado scrolleable e interactivo con casillas de verificación (`[✔]`), íconos, rutas y estado de recomendación.\n- **Barra de Herramientas de Alcance**: Botones de acción inmediata `[➕ Añadir...]`, `[➖ Quitar]`, `[🎯 Recomendadas]`, `[✔ Todas]` y `[✖ Ninguna]` integrados directamente en el panel.\n- **Sincronización Dinámica de Recomendaciones**: Al alternar los tipos de archivo en el paso 2, el listado actualiza al instante las insignias de recomendación (`🎯`) y las carpetas marcadas.\n- **Integración de Unidades del Sistema**: Muestra de forma directa las particiones y discos detectados en el mismo listado para selección inmediata.\n\n---\n\n## [2.0.0] - 2026-09-07\n### Añadido\n- **Identificadores Criptográficos Únicos en Carving**: Implementado hashing MD5 compuesto (`carved_{hash_md5}`) basado en ruta del contenedor, offset absoluto y posición, eliminando cualquier colisión de identificadores.\n- **Rutas de Contenedor Descriptivas**: Cuando un archivo tallado proviene de un formato contenedor (como `.ai`, `.dotx`, `.dotm`, etc.) a partir del byte 0, la ruta muestra claramente el nombre del contenedor y el desplazamiento (ej. `folleto.ai [Offset 0x0]`) en lugar de la confusa etiqueta genérica `[Sector Offset 0x0]`.\n- **Aislamiento Exclusivo en Botón `Solo Visibles`**: Ahora reemplaza el conjunto de selección en lugar de acumularlo (`self.checked_item_ids = set(visible_keys)`), desmarcando al instante cualquier archivo de gran tamaño que haya quedado oculto fuera de los filtros activos.\n- **Medidor Inteligente Transparente**: Desglose explícito en la barra inferior de la tabla (`X visibles marcados (Y KB) | Total lote: Z (W GB)`) para advertir al usuario cuando existen archivos marcados en otras categorías.\n- **Diálogo Interceptor de Seguridad al Exportar**: Si el usuario pulsa *Recuperar Seleccionados* con un filtro activo habiendo archivos pesados marcados en segundo plano, la aplicación despliega una ventana interactiva preventiva para decidir si recuperar únicamente los visibles o el lote completo.\n\n### Corregido\n- Corregido el defecto por el cual al filtrar documentos menores a 500 KB, el medidor mostraba más de 8 GB debido a archivos de video y comprimidos ocultos marcados en segundo plano.\n- Corregida la colisión masiva donde 162 archivos compartían el mismo identificador `carved_1`.\n- Eliminado método duplicado `_on_header_section_clicked` en `ui/results_table.py`.\n\n---\n\n## [1.9.0] - 2026-09-06\n### Añadido\n- **Soporte Multiplataforma para Linux**: Adaptación para distribuciones Linux, con foco en **Linux Bazzite**, Debian, Ubuntu, Fedora y SteamOS.\n- **Lanzadores y Compiladores para Linux**:\n  - `build_linux.sh`: Script de compilación desatendida para generar el binario ejecutable nativo ELF `dist/RecuperadorDeDatos`.\n  - `run_linux.sh`: Lanzador directo con auto-configuración de entorno virtual Python.\n  - `RecuperadorDeDatos.desktop`: Fichero de integración con escritorios KDE Plasma y GNOME.\n- **Abstracción de Rutas y Servicios Linux**:\n  - Detección de unidades y particiones leyendo `/proc/mounts` y `/run/media/$USER`.\n  - Escaneo de papelera de reciclaje estándar FreeDesktop en `~/.local/share/Trash`.\n  - Mapeo de directorios de usuario según el estándar XDG (`Documentos`, `Descargas`, etc.).\n\n---\n\n## [1.8.0] - 2026-09-06\n### Añadido\n- **Catálogo Exhaustivo de 82 Formatos Categorizados**:\n  - **40 Formatos de Documentos**: Suites Microsoft Office (Word, Excel, PowerPoint, Access, Publisher, OneNote), LibreOffice / OpenDocument (ODT, ODS, ODP, ODG), Adobe PDF, EPUB, MOBI, RTF y texto estructurado.\n  - **16 Formatos de Imágenes**: JPEG, PNG, GIF, BMP, WebP, TIFF, SVG, RAW fotográficos (CR2, NEF, ARW, DNG), PSD de Photoshop, etc.\n  - **18 Formatos de Audio y Video**: MP4, MOV, AVI, MKV, WebM, MP3, WAV, FLAC, OGG, M4A, etc.\n  - **8 Formatos de Comprimidos**: ZIP, RAR, 7Z, TAR, GZ, BZ2, XZ, ISO.\n- **Filtrado Granular en Escaneo y Carving**: Parámetro `selected_extensions` en `ScanWorker` y `FileCarver` para restringir la búsqueda en crudo exclusivamente a los formatos elegidos por el usuario, acelerando la velocidad de escaneo.\n\n---\n\n## [1.7.0] - 2026-09-06\n### Añadido\n- **Interfaz Gráfica Limpia con Diálogos Emergentes**:\n  - Reemplazo de checklists invasivos en el panel principal por ventanas modales desplegables compactas (`ui/popups.py`).\n  - **`FileTypesDialog`**: Diálogo con 4 pestañas por categoría, barra de búsqueda en tiempo real, contadores de formatos activos y botones de preset rápido de un clic (`Solo Office`, `Solo PDF`, `Solo Texto`, `Todos`, `Ninguno`).\n  - **`FolderChecklistDialog`**: Selector interactivo de carpetas con casillas de verificación, cálculo de tamaño libre y botones de selección rápida.\n  - **`DirectorySelector`**: Selector de alcance con 3 modos (Indexación Dirigida, Selector Manual y Unidad Completa).\n\n### Corregido\n- Corregido error de indentación (`IndentationError: unexpected indent`) en `ui/results_table.py` línea 328 en el ejecutable compilado.\n\n---\n\n## [1.6.0] - 2026-09-05\n### Añadido\n- **Restauración con Nombres Originales**: Algoritmo en `RecoveryExporter` que recupera el nombre real del archivo a partir de metadatos de papelera (`$I`), metadatos MFT, metadatos EXIF fotográficos o propiedades internas de documentos Office (`dc:title`, `word/document.xml`).\n- **Reconstrucción Jerárquica del Árbol de Carpetas**: Opción para recrear en el directorio destino la estructura exacta de subdirectorios donde residía el archivo antes de eliminarse (ejemplo: `Carpeta_Destino/Disco_C/Users/Usuario/Documentos/...`).\n\n---\n\n## [1.5.0] - 2026-09-05\n### Añadido\n- **Compilación a Ejecutable Autónomo para Windows (`build_exe.py`)**:\n  - Empaquetado completo con PyInstaller generando `dist/RecuperadorDeDatos.exe` (100% portable, sin necesidad de instalar Python ni librerías).\n  - Manejo automático de bloqueos de archivo mediante respaldo temporal si el binario anterior está en uso.\n  - Script por lotes `build.bat` para compilar con un solo doble clic.\n- **Base de Datos Local SQLite Autoconstruida (`core/local_db.py`)**:\n  - Creación automática de `data/recovery_vault.db` en la primera ejecución con 5 tablas relacionales e índices para almacenamiento local 100% offline.\n- **Verificador Preventivo de Requisitos de Sistema (`core/env_checker.py`)**:\n  - Chequeo al arranque de Visual C++ Redistributable, .NET Framework y arquitectura de 64 bits con diálogo nativo Win32 en caso de discrepancias.\n\n---\n\n## [1.4.0] - 2026-09-05\n### Añadido\n- **Analizador de Integridad y Usabilidad Forense (`core/integrity_analyzer.py`)**:\n  - Medición de ratio de bytes nulos (`0x00`) para descarte de sectores vacíos y bloques borrados.\n  - Medición de entropía de información de Shannon para descarte de patrones sin estructura.\n  - Clasificación en 4 niveles de usabilidad: 🌟 Alta Calidad, 🟡 Media, 🟠 Baja y 🔴 Inútil.\n  - Botón `🌟 Solo Alta Calidad` en la tabla de resultados para desmarcar basura con un solo clic.\n  - Asistente de seguridad al exportar para prevenir la recuperación accidental de archivos inservibles.\n- **Parsers Binarios Estructurales en `core/file_carver.py`**:\n  - JPEG: Recorrido formal de marcadores con salto de miniaturas incrustadas EXIF para evitar el truncamiento prematuro.\n  - PNG: Validación matemática de integridad mediante sumas de verificación CRC32 por chunk.\n  - MP4 / MOV: Navegación de átomos ATOM (`ftyp`, `moov`, `mdat`) y extracción de resolución y duración.\n  - RIFF: Extracción de audio WAV PCM y video AVI.\n  - OOXML: Extracción de texto y párrafos de documentos Word, Excel y PowerPoint.\n\n---\n\n## [1.3.0] - 2026-09-04\n### Corregido\n- Solucionado error de escaneo: `TypeError: Object of type datetime is not JSON serializable` mediante codificador de fecha ISO-8601 en `core/session_manager.py`.\n\n---\n\n## [1.2.0] - 2026-09-04\n### Añadido\n- **Sistema de Sesiones Persistentes (`core/session_manager.py`)**:\n  - Almacenamiento de sesiones en ficheros JSON dentro del directorio `sessions/`.\n  - Serialización y deserialización de muestras binarias de previsualización en Base64.\n  - **Escaneo Diferencial e Incremental**: Matriz de huellas digitales (*fingerprints*) para saltar archivos sin cambios y fusionar únicamente novedades en reescaneos.\n  - Diálogo visual de administración de sesiones (`ui/session_dialog.py`).\n\n---\n\n## [1.1.0] - 2026-09-03\n### Añadido\n- **Analizador MFT NTFS (`core/mft_scanner.py`)**: Búsqueda de registros eliminados en la Master File Table con extracción de atributos y datos residentes.\n- **Explorador de Copias de Sombra VSS (`core/shadow_explorer.py`)**: Consulta y rescate de versiones anteriores de archivos mediante Volume Shadow Copies de Windows.\n- **Filtro Inteligente de Software y Juegos (`core/software_filter.py`)**: Detección automática en Registro y carpetas de juegos para excluir miles de archivos irrelevantes del sistema, reduciendo el tiempo de escaneo en un 85%.\n- **Enrutador Contextual (`core/context_router.py`)**: Mapeo inteligente de carpetas según el tipo de archivo buscado.\n\n---\n\n## [1.0.0] - 2026-09-01\n### Añadido\n- **Lanzamiento Inicial de la Suite Forense**:\n  - Arquitectura multi-hilo basada en PyQt5 y `QThread`.\n  - Escáner de Papelera de Reciclaje (`$Recycle.Bin`) con rescate de huérfanos `$R`.\n  - Extractor de imágenes en caché gráfica (`thumbcache_*.db`).\n  - Escáner de borradores de Office y temporales (`%TEMP%`, `.asd`, `.xar`).\n  - Motor básico de tallado por firmas (*File Carving*).\n  - Barra de telemetría HUD en tiempo real con cronómetro, velocímetro y volumen analizado.\n  - Visor interactivo multi-pestaña (gráfico, multimedia, texto, volcado hexadecimal y metadatos).\n  - Tema oscuro profesional inspirado en herramientas periciales.\n\n"}, "readme": {"id": "readme", "title": "README General", "icon": "🛡️", "badge": "Visión Global", "markdown": "# 🛡️ Recuperador de Datos Forense (Deep Recovery Suite)\n\nUna potente suite de escritorio desarrollada en **Python** y **PyQt5** con telemetría en tiempo real, protocolos forenses multicapa de bajo nivel, **Filtro Inteligente de Software** y **Ruteo Contextual con Selector Manual de Directorios** para buscar, analizar y recuperar archivos eliminados, modificados, dañados o no guardados en Windows y Linux.\n\n---\n\n## 📚 Documentación Oficial y Manuales del Proyecto\n\n| Manual / Documento | Audiencia Objetivo | Contenido Principal |\n|---|---|---|\n| [🌐 **Portal Interactivo por Pestañas (HTML)**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/documentacion.html) | **Todos (Recomendado)** | **Visualizador web interactivo con pestañas, índices dinámicos (TOC), buscador en vivo y modo oscuro/claro (100% offline).** |\n| [📖 **Manual de Usuario Común**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/docs/MANUAL_USUARIO_COMUN.md) | Usuarios finales | Guía paso a paso en 5 pasos simples, consejos de seguridad, uso de filtros y recuperación rápida. |\n| [🔬 **Manual Técnico y Forense**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/docs/MANUAL_TECNICO_Y_FORENSE.md) | Técnicos, SysAdmins, Peritos | Análisis de los 6 protocolos (MFT, Carving, VSS, Papelera, Thumbcache), fórmulas matemáticas de entropía y nulos. |\n| [🏛️ **Arquitectura y Estructura**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/docs/ARQUITECTURA_Y_ESTRUCTURA.md) | Arquitectos, Programadores | Lenguajes (Python, Qt, SQLite), mapa completo del código y diagramas de flujo de datos. |\n| [🔨 **Compilación y Distribución**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/docs/COMPILACION_Y_DISTRIBUCION.md) | Desarrolladores, DevOps | Guía para compilar el ejecutable autónomo para Windows (`.exe`) y binario nativo para Linux. |\n| [💻 **Manual de Desarrollador y Porting**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/docs/MANUAL_DESARROLLADOR_Y_PORTING.md) | Desarrolladores, Contribuidores | Cómo agregar formatos/firmas, crear parsers estructurales y portar a otros sistemas operativos (macOS, BSD). |\n| [📜 **Registro Histórico de Cambios**](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/docs/CHANGELOG.md) | Todo público | Bitácora de evolución histórica desde la versión 1.0.0 hasta la 2.0.0. |\n\n---\n\n### 1. 🌟 Analizador de Integridad y Usabilidad Forense (Restauración Exclusiva de Alta Calidad)\n- **Motor de Evaluación de Usabilidad Práctica ([core/integrity_analyzer.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/core/integrity_analyzer.py))**:\n  - **Detección y Descarte de Archivos Basura y Falsos Positivos**:\n    - *Relleno Nulo de Sectores Vacíos:* Calcula el porcentaje de bytes nulos (`0x00`). Si supera el 85%, identifica el sector como libre o borrado y lo califica automáticamente como `🔴 Inutilizable (5%)`.\n    - *Entropía de Shannon Coherente:* Descarta patrones repetitivos uniformes sin contenido estructurado.\n    - *Filtrado de Iconos Microscópicos de Sistema:* Penaliza imágenes diminutas ($\\le 64\\times 64$ o $\\le 150\\times 150$ px) como sprites o miniaturas residuales de caché, premiando fotos de resolución estándar y HD/4K ($\\ge 800\\times 600$, $\\ge 1080$p).\n    - *Validación de Reproducibilidad en Audio y Video:* Comprueba la presencia conjunta de metadatos de reproducción (`moov`) y flujo de video (`mdat`), descartando micro-fragmentos incompletos ($< 1.0$s) o grabaciones dañadas.\n    - *Verificación de Legibilidad en Documentos:* Extrae y valida que documentos Word/Excel/PDF o archivos de texto contengan información legible real ($\\ge 90\\%$ caracteres legibles y párrafos útiles), detectando ruido binario falso.\n  - **Escala Cuádruple de Viabilidad**:\n    - 🌟 **Alta Calidad (80 - 100%)**: Estructura íntegra, abrible sin errores, resolución o duración óptima.\n    - 🟡 **Calidad Media (50 - 79%)**: Archivos funcionales con resolución o tamaño moderado.\n    - 🟠 **Baja Calidad (20 - 49%)**: Muy truncado, parcial o severamente degradado.\n    - 🔴 **Inutilizable / Basura (0 - 19%)**: Archivos vacíos (0 bytes), sectores nulos o cabeceras rotas.\n- **Columna Interactiva y Filtros en Tabla ([ui/results_table.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/ui/results_table.py))**:\n  - **Nueva Columna `Calidad / Integridad`**: Badges a color y ordenamiento numérico por puntaje.\n  - **Filtro de Usabilidad**: Desplegable para alternar entre `Todas las Calidades`, `🌟 Solo Alta Calidad (≥ 80%)`, `🌟+🟡 Calidad Media y Alta (≥ 50%)` y `🛡️ Ocultar Inutilizables (< 20%)`.\n  - **Botón `🌟 Solo Alta Calidad`**: Un clic para desmarcar toda la basura y seleccionar exclusivamente archivos de alta calidad.\n- **Diálogo de Seguridad al Exportar ([ui/main_window.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/ui/main_window.py))**:\n  - Advierte al usuario si hay archivos de baja calidad seleccionados y ofrece restaurar únicamente los de Alta Calidad.\n\n---\n\n### 2. 🔍 Vista Previa Forense Multifuncional y Reconstrucción Estructural Íntegra\n- **Reconstrucción Estructural de Alta Integridad ([core/file_carver.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/core/file_carver.py))**:\n  - **Eliminación del Truncamiento Prematuro en JPEG**: Los programas de recuperación convencionales suelen cortar las fotos al encontrar la primera marca `\\xFF\\xD9` de la miniatura EXIF incrustada en la cabecera. Nuestro parser estructural recorre ordenadamente los marcadores `SOI`, `APPn`, `DQT`, `DHT`, `SOF0/SOF2`, gestiona el *byte-stuffing* (`\\xFF\\x00`) dentro del flujo de entropía `SOS` y sólo concluye en el verdadero `EOI` final, recuperando la imagen en su resolución completa.\n  - **Validación Matemática de Chunks PNG con CRC32**: Valida cada bloque desde `IHDR` hasta `IEND` calculando y comprobando el algoritmo de redundancia cíclica CRC32, garantizando imágenes sin corrupción ni líneas grises.\n  - **Navegación de Cajas ATOM en Videos MP4 / MOV**: Recorre la jerarquía de átomos (`ftyp`, `moov`, `mvhd`, `tkhd`, `mdat`, `free`), detectando resoluciones reales (1080p, 2K, 4K UHD), códec y duración exacta en segundos.\n  - **Parser RIFF para WAV, WebP y AVI**: Reconstruye bloques de audio PCM (canales, frecuencia de muestreo) y video AVI delimitando el tamaño real exacto.\n  - **Extracción de Contenido Office OOXML (DOCX, XLSX, PPTX)**: Inspecciona el directorio central ZIP (`EOCD`) y procesa los árboles XML internos para extraer párrafos y texto recuperable sin depender de Office instalado.\n  - **Calificación de Integridad Forense**: Cada archivo recuperado incluye `specs` técnicas detalladas, `integrity_score` (0-100%) y `integrity_status` (`Íntegro`, `Estructura Parcial`, `Corrupto`).\n\n- **Visor de Previsualización Profesional ([ui/preview_widget.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/ui/preview_widget.py))**:\n  - **Badge de Diagnóstico e Integridad**: Indicador visual destacado en el encabezado con código de colores (`🛡️ ÍNTEGRO (100%)`, `⚠️ ESTRUCTURA PARCIAL`, `❌ CORRUPTO`).\n  - **Visor Visual Interactivo con Zoom y Paneo**: Barra de herramientas con `➕ Acercar`, `➖ Alejar`, `🔍 100%`, `↔ Ajustar a Ventana`, scroll con paneo libre, cálculo de megapíxeles (MP), relación de aspecto (16:9, 4:3, etc.) y lectura de metadatos EXIF (modelo de cámara, fecha de captura).\n  - **Reproductor Multimedia Integrado**: Pantalla de video y tarjeta de audio integrada (`QMediaPlayer` + `QVideoWidget`) con reproducción en vivo de sectores recuperados, barra de tiempo deslizable (seek slider), duración transcurrida/total y control de volumen.\n  - **Visor de Documentos y Árboles ZIP**: Muestra el texto extraído de documentos de Word, celdas de Excel y diapositivas de PowerPoint, árbol estructurado de ficheros para `.zip`, y visor de código y texto plano con detección de codificación.\n  - **Visor Hexadecimal con Entropía de Shannon**: Volcado de 16 bytes con panel ASCII, detección de firmas *Magic Bytes* y cálculo de entropía de información de Shannon (0.00 a 8.00 bits/byte) para identificar compresión o cifrado.\n  - **Metadatos y Hash Criptográfico SHA-256**: Tabla de propiedades técnicas y cálculo de firma hash on-demand.\n\n---\n\n### 2. 💾 Sesiones de Exploración Persistentes y Escaneo Incremental / Diferencial\n- **Persistencia Completa sin Reescaneo ([core/session_manager.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/core/session_manager.py))**:\n  - Guarda automáticamente o a petición del usuario la sesión de exploración en formato JSON estructurado en `sessions/`.\n  - Si cierras el programa o reinicias el equipo, puedes abrir el **Gestor de Sesiones (`📂 Sesiones Guardadas...`)** y cargar al instante todos los resultados encontrados previamente con sus metadatos y previsualizaciones sin tener que reescanear el disco.\n- **Motor de Escaneo Incremental / Diferencial Inteligente**:\n  - Al volver a escanear una misma unidad o conjunto de carpetas, el sistema detecta la sesión previa y genera una matriz de **huellas digitales (fingerprints)** basada en rutas, fechas y tamaños.\n  - **Omisión instantánea de datos sin cambios**: El motor de escaneo y *carving* salta los archivos ya conocidos y concentra el tiempo de lectura exclusivamente en datos nuevos o modificados.\n  - **Fusión sin duplicados**: Las novedades se integran automáticamente con la sesión histórica etiquetadas como `[Nuevo]` o `[Actualizado]`, manteniendo intacto todo el catálogo acumulado.\n- **Gestor Visual de Sesiones ([ui/session_dialog.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/ui/session_dialog.py))**:\n  - Permite revisar sesiones previas, fecha de actualización, total de archivos y gigabytes encontrados, renombrar sesiones con nombres personalizados o eliminarlas.\n\n---\n\n### 2. 🗂️ Filtrado por Tipo de Archivo y Organización Dinámica ([ui/results_table.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/ui/results_table.py))\n- **Filtrado por Tipo de Archivo y Extensión Específica**:\n  - **Selector de Categoría**: Permite filtrar instantáneamente por *Imágenes, Documentos, Audio, Video, Comprimidos, Código, Otros*.\n  - **Selector Dinámico de Tipo / Extensión**: Analiza todos los hallazgos y genera automáticamente un desplegable con las extensiones detectadas y su conteo (ej. `.DOCX (24)`, `.PDF (15)`, `.JPG (42)`, `.MP4 (6)`).\n  - **Búsqueda Rápida en Vivo**: Filtra en tiempo real por nombre de archivo o ruta de origen.\n  - **Botón `🔄 Limpiar`**: Restablece los filtros con un solo clic.\n- **Organización y Ordenamiento Multinivel**:\n  - Selector **`🔃 Organizar por:`** con todas las dimensiones solicitadas:\n    - 📝 **Nombre** (A → Z y Z → A)\n    - 🏷️ **Tipo de Archivo / Extensión** (A → Z y Z → A)\n    - 📂 **Ruta Original** (A → Z y Z → A)\n    - 💾 **Tamaño** (Mayor a Menor y Menor a Mayor, con comparación numérica real por bytes)\n    - 🕒 **Fecha** (Más reciente y Más antigua)\n  - **Clic en Cabeceras de Tabla**: Permite ordenar directamente al hacer clic en las columnas *Nombre, Tipo, Categoría, Tamaño, Fecha y Ruta*.\n- **Preservación de Selecciones Masivas**:\n  - Selección persistente mediante identificadores únicos: puedes filtrar por `.pdf`, marcar varios archivos, luego filtrar por `.jpg` y marcar otros; el sistema conserva ambas selecciones intactas para la recuperación.\n  - Botón **`✔ Solo Visibles`**: Marca únicamente los archivos que cumplen con los filtros activos.\n\n---\n\n### 3. 🎯 Ruteo Contextual Automático y Selector Manual de Directorios\n- **Mapeo Inteligente por Tipo de Archivo ([core/context_router.py](file:///c:/Users/Drhapso/Documents/PROYECTOS%20IA%20INDEPENDIENTES/RECUPERADOR%20DE%20DATOS/core/context_router.py))**:\n  - Si buscas **Documentos**: El motor indexa automáticamente `Mis Documentos`, `Escritorio`, `Descargas`, `OneDrive` y tus carpetas de proyectos personales, omitiendo carpetas pesadas de videos, música y texturas.\n  - Si buscas **Fotos**: Prioriza `Imágenes (Pictures)`, `Screenshots`, `OneDrive\\Pictures`, `DCIM` y la caché gráfica (`thumbcache`), omitiendo repositorios de código y videos.\n  - Si buscas **Audio**: Detecta y prioriza automáticamente `Mi Música` y `Grabaciones de Sonido / Voz` locales.\n- **Selector Manual Interactivo (Checklist en UI)**:\n  - Selector con 3 modos de alcance:\n    1. **🎯 Indexación Dirigida (Automática)**: Aplica al instante la selección óptima de carpetas según las categorías marcadas.\n    2. **🖐️ Selector Manual (Checklist)**: Permite marcar y desmarcar casillas de verificación carpeta por carpeta.\n    3. **💽 Unidad Completa**: Escaneo tradicional de un disco entero (`C:\\`, `D:\\`, `E:\\`, etc.).\n  - Botones de acción rápida:\n    - `➕ Añadir Carpeta Personalizada...`: Permite sumar cualquier carpeta del equipo o unidad externa.\n    - `➖ Quitar`: Elimina carpetas personalizadas de la lista.\n    - `🎯 Marcar Recomendadas`: Recalcula la selección óptima según las categorías activas.\n    - `Marcar Todas` / `Desmarcar`.\n\n---\n\n### 2. ⚡ Filtro Inteligente de Software y Juegos (Ahorro del 85% de Tiempo)\n- **Pre-Escaneo Automático (< 0.1s)**: Analiza el Registro de Windows y bibliotecas de videojuegos (`C:\\Games`, Steam, Epic Games, Riot, Battle.net, etc.) catalogando automáticamente las rutas de software instalado (en tu equipo catalogó **128 ubicaciones**).\n- **Poda Inteligente de Árboles**: Durante el escaneo profundo, omite por completo entrar a carpetas de texturas, shaders, binarios `.dll`, archivos de empaquetado `.pak`/`.vpk` y dependencias (`node_modules`, `.nuget`, `site-packages`).\n- **Protección Estricta de Datos de Usuario**: Las carpetas sagradas de documentos personales (`Documentos`, `Escritorio`, `Fotos`, `Videos`, `Partidas Guardadas / Saved Games` y proyectos personales) tienen prioridad absoluta y **jamás** son omitidas.\n\n---\n\n### 3. 📊 Barra de Información y Telemetría en Vivo (HUD)\n- **Visualización en Tiempo Real**: Muestra el archivo exacto, la carpeta o el sector hexadecimal que se está analizando en cada milisegundo.\n- **Cronómetro de Escaneo**: Contador preciso de tiempo transcurrido (`HH:MM:SS`).\n- **Velocímetro de Procesamiento**: Cálculo instantáneo de velocidad de escaneo (`MB/s` y `archivos/s`).\n- **Volumen Analizado**: Indicador dinámico de bytes y gigabytes procesados en disco.\n- **Contadores en Vivo por Categoría**: Fotos, Documentos, Multimedia y Comprimidos.\n\n---\n\n### 4. 🛡️ Protocolos de Recuperación de Máxima Robustez\n\n1. **Recuperación Forense de Papelera con Rescate de Huérfanos `$R`**:\n   - Analiza registros `$I` y datos `$R`. Rescata contenedores `$R` huérfanos examinando sus *Magic Bytes* si herramientas de limpieza destruyeron los índices `$I`.\n\n2. **Extractor Forense de Miniaturas de Windows (`thumbcache_*.db`)**:\n   - Rescata imágenes JPEG, PNG y BMP en alta definición (hasta 2560p, 1920p y 1280p) desde la caché gráfica del sistema cuando las originales fueron sobreescritas en disco.\n\n3. **Motor de File Carving Estructural**:\n   - Calcula matemáticamente el tamaño exacto del archivo leyendo las estructuras internas de los contenedores (cajas ATOM de MP4, bloques RIFF de WAV/WebP/AVI, Chunks PNG con CRC32, EOCD en ZIP/Office OOXML, páginas SQLite, fotos RAW, FLAC, MKV).\n\n4. **Analizador MFT NTFS (Master File Table Forensics)**:\n   - Detecta registros MFT de 1024 bytes marcados con el flag `0x00` (eliminado), rescatando marcas de tiempo, nombres originales y **datos residentes**.\n\n5. **Copias de Sombra de Windows (VSS - Volume Shadow Copies)**:\n   - Detección de puntos de restauración para rescatar versiones anteriores de archivos sobrescritos.\n\n---\n\n## 📂 Estructura del Proyecto\n\n```\nRECUPERADOR DE DATOS/\n├── main.py                     # Punto de entrada principal con escalado High-DPI\n├── requirements.txt            # Dependencias del proyecto (PyQt5, Pillow, PyInstaller)\n├── run.bat                     # Lanzador en modo estándar para Windows\n├── run_as_admin.bat            # Lanzador con elevación UAC (Administrador) para Windows\n├── run_
